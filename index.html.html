<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Segnapunti Scopa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 4px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── HEADER (avversario) ── */
  .header {
    flex: 0 0 auto;
    background: #2a1a1a;
    border: 1.5px solid #7f1d1d;
    border-radius: 8px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .header .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header .title {
    font-size: 0.68rem;
    color: #f87171;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── GRIGLIA CARTE ── */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
    min-height: 0;
  }

  .card {
    border: 1.5px solid #444;
    background: #2a2a3e;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 0;
    transition: transform 0.1s ease, box-shadow 0.15s ease,
                background 0.15s ease, border-color 0.15s ease,
                opacity 0.25s ease;
    touch-action: none;
    -webkit-user-drag: none;
    will-change: transform;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
    pointer-events: none;
    -webkit-user-drag: none;
    transition: opacity 0.15s ease, filter 0.15s ease;
  }

  .card.discarded { background: #3a3a4a; border-color: #3a3a4a; }
  .card.discarded img { opacity: 0.55; filter: brightness(0.5) grayscale(0.4); }

  .card.taken-us {
    background: #14532d;
    border-color: #22c55e;
    box-shadow: inset 0 0 10px rgba(34,197,94,0.6);
  }
  .card.taken-us img { opacity: 0; }

  .card.taken-them {
    background: #4c1d1d;
    border-color: #ef4444;
    box-shadow: inset 0 0 10px rgba(239,68,68,0.6);
  }
  .card.taken-them img { opacity: 0; }

  .card.dragging {
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    z-index: 50;
    cursor: grabbing;
    border-color: #fbbf24;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 16px rgba(251,191,36,0.8);
  }
  .card.dragging-us {
    border-color: #22c55e;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(34,197,94,1);
  }
  .card.dragging-them {
    border-color: #ef4444;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(239,68,68,1);
  }

  /* ── FOOTER (noi) ── */
  .footer {
    flex: 0 0 auto;
    background: #1a2a1a;
    border: 1.5px solid #166534;
    border-radius: 8px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .footer .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer .title {
    font-size: 0.68rem;
    color: #4ade80;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── STATS ── */
  .stats {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr 1.4fr;
    gap: 4px;
    align-items: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
  }

  .stat .icon {
    font-size: clamp(0.75rem, 2.8vw, 0.95rem);
    line-height: 1;
  }

  .stat .value {
    font-size: clamp(0.7rem, 2.8vw, 0.95rem);
    font-weight: bold;
    line-height: 1;
    color: #fbbf24;
  }

  .stat.zero .value { color: #555; }

  .stat .label {
    font-size: 0.5rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Totale: più grande e dorato */
  .stat.total {
    border-radius: 6px;
    padding: 2px 4px;
  }

  .stat.total .value {
    font-size: clamp(1.1rem, 4.5vw, 1.5rem);
    color: #fbbf24;
  }

  .header .stat.total { background: rgba(251,191,36,0.1); }
  .footer .stat.total { background: rgba(251,191,36,0.1); }

  /* Primiera: numero */
  .stat.primiera .value {
    color: #a78bfa;
  }

  .stat.primiera.zero .value { color: #555; }

  /* ── RIGA CENTRALE PRIMIERA ── */
  .primiera-row {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 3px 0;
  }

  .primiera-side {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    align-items: center;
  }

  /* Le celle sono 15% più piccole: aspect-ratio 2/3 ma con max-height */
  .primiera-cell {
    aspect-ratio: 2 / 3;
    max-height: 46px;
    border-radius: 3px;
    border: 1px solid #3a3a4a;
    background: rgba(0,0,0,0.3);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    justify-self: center;
    width: 100%;
    max-width: 32px;
  }

  .primiera-cell.empty {
    border-style: dashed;
    border-color: #333;
  }

  .primiera-cell.empty::after {
    content: attr(data-suit-icon);
    font-size: 0.75rem;
    opacity: 0.25;
    filter: grayscale(1);
  }

  .primiera-cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
  }

  .primiera-cell.won {
    border-color: #22c55e;
    box-shadow: 0 0 6px rgba(34,197,94,0.9);
  }

  /* Lato LORO: bordo rosso tenue */
  .primiera-side.them .primiera-cell:not(.empty) {
    border-color: #7f1d1d;
  }
  .primiera-side.them .primiera-cell.won {
    border-color: #22c55e;
  }

  /* Lato NOI: bordo verde tenue */
  .primiera-side.us .primiera-cell:not(.empty) {
    border-color: #166534;
  }

  /* ── RESET ── */
  .reset-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
  }
  .reset-bar button {
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.68rem;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ── HINT ── */
  .hint {
    position: fixed;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    background: rgba(0,0,0,0.92);
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    text-align: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    line-height: 1.7;
    border: 1px solid #444;
  }
  .hint.show { opacity: 1; }
  .hint b { color: #fbbf24; }
</style>
</head>
<body>

  <!-- HEADER: LORO -->
  <div class="header">
    <div class="title-row">
      <span class="title">▼ LORO</span>
    </div>
    <div class="stats" id="stats-them"></div>
  </div>

  <!-- GRIGLIA -->
  <div class="grid" id="grid"></div>

  <!-- RIGA CENTRALE PRIMIERA: noi a sx, loro a dx -->
  <div class="primiera-row">
    <div class="primiera-side us" id="primiera-us"></div>
    <div class="primiera-side them" id="primiera-them"></div>
  </div>

  <!-- FOOTER: NOI -->
  <div class="footer">
    <div class="stats" id="stats-us"></div>
    <div class="title-row">
      <span class="title">▲ NOI</span>
    </div>
  </div>

  <!-- RESET -->
  <div class="reset-bar">
    <button onclick="resetAll()">RESET</button>
  </div>

  <!-- HINT -->
  <div class="hint" id="hint">
    <b>Tap</b> = carta uscita<br>
    <b>Trascina giù ↓</b> = presa nostra<br>
    <b>Trascina su ↑</b> = presa loro
  </div>

<script>
  // ═══════════════════════════════════════════════
  //  CONFIGURAZIONE
  // ═══════════════════════════════════════════════
  const SUITS = ['DENARI', 'COPPE', 'SPADE', 'BASTONI'];
  const SUIT_ICONS = { DENARI: '🪙', COPPE: '🏆', SPADE: '⚔️', BASTONI: '🪵' };
  const SUITS_ORDER = ['SPADE', 'COPPE', 'BASTONI', 'DENARI'];
  const ROWS = 10;
  const COLS = 4;
  const STORAGE_KEY = 'scopa_mono_v8';
  const DRAG_THRESHOLD = 12;
  const MAX_ROW = 7;
  const FLY_DURATION = 350;

  const PRIMIERA_VALUE = {
    1: 16, 2: 12, 3: 13, 4: 14, 5: 15, 6: 18, 7: 21,
    8: 10, 9: 10, 10: 10
  };

  let cardStates = new Array(ROWS * COLS).fill(0);
  // 0 = nuova, 1 = uscita, 2 = presa da NOI, 3 = presa da LORO

  // ═══════════════════════════════════════════════
  //  UTILITÀ
  // ═══════════════════════════════════════════════
  function cardInfo(index) {
    const row = Math.floor(index / COLS) + 1;
    const col = index % COLS;
    return { row, col, suit: SUITS[col] };
  }
  function cardFileName(index) {
    const { row, suit } = cardInfo(index);
    return `${row} ${suit}.jpg`;
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE GRIGLIA
  // ═══════════════════════════════════════════════
  const grid = document.getElementById('grid');
  const fragment = document.createDocumentFragment();

  for (let row = 1; row <= ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const index = (row - 1) * COLS + col;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const img = document.createElement('img');
      img.src = cardFileName(index);
      img.alt = `${row} ${SUITS[col]}`;
      img.draggable = false;
      img.onerror = function() {
        this.style.display = 'none';
        card.style.background = '#333';
        card.style.color = '#fff';
        card.style.fontSize = '0.55rem';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.justifyContent = 'center';
        card.textContent = `${row}\n${SUITS[col].slice(0,3)}`;
        card.style.whiteSpace = 'pre-line';
      };
      card.appendChild(img);

      attachHandlers(card, index);
      fragment.appendChild(card);
    }
  }
  grid.appendChild(fragment);

  const allCards = () => document.querySelectorAll('.card');

  // ═══════════════════════════════════════════════
  //  DRAG
  // ═══════════════════════════════════════════════
  let activeDrag = null;

  function attachHandlers(card, index) {
    card.addEventListener('pointerdown', (e) => {
      if (cardStates[index] !== 0) return;
      e.preventDefault();
      startDrag(index, card, e.clientX, e.clientY);
    });

    card.addEventListener('touchstart', (e) => {
      if (window.PointerEvent) return;
      if (cardStates[index] !== 0) return;
      const t = e.touches[0];
      startDrag(index, card, t.clientX, t.clientY);
      e.preventDefault();
    }, { passive: false });

    card.addEventListener('mousedown', (e) => {
      if (window.PointerEvent) return;
      if (cardStates[index] !== 0) return;
      e.preventDefault();
      startDrag(index, card, e.clientX, e.clientY);
    });

    card.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function startDrag(index, card, x, y) {
    activeDrag = { index, card, startX: x, startY: y, mode: null };
    card.classList.add('dragging');
  }

  function updateDrag(x, y) {
    if (!activeDrag) return;
    const dx = x - activeDrag.startX;
    const dy = y - activeDrag.startY;
    const dist = Math.hypot(dx, dy);

    activeDrag.card.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;

    if (dist > DRAG_THRESHOLD) {
      const mode = dy > 0 ? 'us' : 'them';
      if (mode !== activeDrag.mode) {
        activeDrag.card.classList.remove('dragging-us', 'dragging-them');
        activeDrag.mode = mode;
        activeDrag.card.classList.add(mode === 'us' ? 'dragging-us' : 'dragging-them');
      }
    } else if (activeDrag.mode) {
      activeDrag.card.classList.remove('dragging-us', 'dragging-them');
      activeDrag.mode = null;
    }
  }

  function endDrag(x, y) {
    if (!activeDrag) return;
    const { index, card, startX, startY } = activeDrag;

    const dx = x - startX;
    const dy = y - startY;
    const dist = Math.hypot(dx, dy);

    card.classList.remove('dragging', 'dragging-us', 'dragging-them');

    if (dist <= DRAG_THRESHOLD) {
      card.style.transform = '';
      activeDrag = null;
      applicaStato(index, 1);
      ricalcolaPunteggi();
      saveState();
      return;
    }

    const targetY = dy > 0 ? dy + 200 : dy - 200;
    card.style.transform = `translate(${dx}px, ${targetY}px) scale(0.6)`;

    const nuovoStato = dy > 0 ? 2 : 3;
    applicaStato(index, nuovoStato);

    setTimeout(() => { card.style.transform = ''; }, FLY_DURATION);

    activeDrag = null;
    ricalcolaPunteggi();
    saveState();
  }

  function cancelDrag() {
    if (activeDrag) {
      activeDrag.card.classList.remove('dragging', 'dragging-us', 'dragging-them');
      activeDrag.card.style.transform = '';
      activeDrag = null;
    }
  }

  document.addEventListener('pointermove', (e) => {
    if (!activeDrag) return;
    updateDrag(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', (e) => {
    if (!activeDrag) return;
    endDrag(e.clientX, e.clientY);
  });
  document.addEventListener('pointercancel', cancelDrag);

  document.addEventListener('touchmove', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    const t = e.touches[0];
    updateDrag(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    const t = e.changedTouches[0];
    endDrag(t.clientX, t.clientY);
  });
  document.addEventListener('touchcancel', () => {
    if (window.PointerEvent) return;
    cancelDrag();
  });

  document.addEventListener('mousemove', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    updateDrag(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    endDrag(e.clientX, e.clientY);
  });

  // ═══════════════════════════════════════════════
  //  APPLICAZIONE STATO
  // ═══════════════════════════════════════════════
  function applicaStato(index, nuovoStato) {
    cardStates[index] = nuovoStato;
    const el = allCards()[index];
    if (!el) return;

    el.classList.remove('discarded', 'taken-us', 'taken-them');
    if (nuovoStato === 1) el.classList.add('discarded');
    else if (nuovoStato === 2) el.classList.add('taken-us');
    else if (nuovoStato === 3) el.classList.add('taken-them');
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE STATS (header e footer)
  // ═══════════════════════════════════════════════
  function buildStatsFor(containerId, chi) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    // Ordine: Totale, Ori, Carte, Primiera (numero)
    const items = [
      { key: 'total',    icon: '🏆', label: 'Totale',  total: true },
      { key: 'denari',   icon: '🪙', label: 'Ori'   },
      { key: 'carte',    icon: '🃏', label: 'Carte' },
      { key: 'primiera', icon: '🎯', label: 'Primiera', primiera: true }
    ];

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'stat zero';
      if (item.total) div.classList.add('total');
      if (item.primiera) div.classList.add('primiera');
      div.dataset.player = chi;
      div.dataset.key = item.key;

      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = item.icon;

      const val = document.createElement('div');
      val.className = 'value';
      val.textContent = '0';

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = item.label;

      div.appendChild(icon);
      div.appendChild(val);
      div.appendChild(lab);
      container.appendChild(div);
    });
  }

  buildStatsFor('stats-them', 3);
  buildStatsFor('stats-us', 2);

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE RIGA CENTRALE PRIMIERA
  // ═══════════════════════════════════════════════
  function buildPrimieraRow(containerId, chi) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    SUITS_ORDER.forEach(suit => {
      const cell = document.createElement('div');
      cell.className = 'primiera-cell empty';
      cell.dataset.suit = suit;
      cell.dataset.player = chi;
      cell.dataset.suitIcon = SUIT_ICONS[suit];
      container.appendChild(cell);
    });
  }

  buildPrimieraRow('primiera-us', 2);
  buildPrimieraRow('primiera-them', 3);

  // ═══════════════════════════════════════════════
  //  CALCOLO STATS
  // ═══════════════════════════════════════════════
  function calcolaStats(chi) {
    let denari = 0;
    let numCarte = 0;
    let hasSettebello = false;
    const bestPerSuit = { DENARI: null, COPPE: null, SPADE: null, BASTONI: null };

    cardStates.forEach((stato, index) => {
      if (stato !== chi) return;
      const { row, col, suit } = cardInfo(index);
      numCarte++;
      if (suit === 'DENARI') {
        denari++;
        if (row === 7) hasSettebello = true;
      }

      const val = PRIMIERA_VALUE[row] || 0;
      if (!bestPerSuit[suit] || val > bestPerSuit[suit].value) {
        bestPerSuit[suit] = { value: val, row, suit, index };
      }
    });

    const semiCompleti = Object.values(bestPerSuit).filter(b => b !== null).length;
    const primieraValore = Object.values(bestPerSuit).reduce(
      (sum, b) => sum + (b ? b.value : 0), 0
    );

    return { denari, numCarte, hasSettebello, bestPerSuit, semiCompleti, primieraValore };
  }

  function calcolaVincitori(stats0, stats1) {
    // stats0 = NOI (chi=2), stats1 = LORO (chi=3)
    // Restituisce: { denariVinti, carteVinti, primieraVinta }

    // Denari: chi ne ha di più
    let denariVinti = null;
    if (stats0.denari !== stats1.denari) {
      denariVinti = stats0.denari > stats1.denari ? 'us' : 'them';
    }

    // Carte: chi ha ≥ 21
    let carteVinte = null;
    const c0 = stats0.numCarte >= 21;
    const c1 = stats1.numCarte >= 21;
    if (c0 && !c1) carteVinte = 'us';
    else if (c1 && !c0) carteVinte = 'them';
    // se entrambi ≥ 21 (impossibile con 40 carte ma per sicurezza) → nessuno

    // Primiera: chi ha tutti e 4 i semi e valore più alto
    let primieraVinta = null;
    const p0Ok = stats0.semiCompleti === 4;
    const p1Ok = stats1.semiCompleti === 4;
    if (p0Ok && p1Ok) {
      if (stats0.primieraValore > stats1.primieraValore) primieraVinta = 'us';
      else if (stats1.primieraValore > stats0.primieraValore) primieraVinta = 'them';
    } else if (p0Ok) {
      primieraVinta = 'us';
    } else if (p1Ok) {
      primieraVinta = 'them';
    }

    return { denariVinti, carteVinte, primieraVinta };
  }

  function ricalcolaPunteggi() {
    const statsUs = calcolaStats(2);
    const statsThem = calcolaStats(3);
    const vinc = calcolaVincitori(statsUs, statsThem);

    // ── Header LORO ──
    const themContainer = document.getElementById('stats-them');
    const totThem = (statsThem.hasSettebello ? 1 : 0)
                  + (vinc.carteVinte === 'them' ? 1 : 0)
                  + (vinc.denariVinti === 'them' ? 1 : 0)
                  + (vinc.primieraVinta === 'them' ? 1 : 0);
    themContainer.querySelector('[data-key="total"] .value').textContent = totThem;
    themContainer.querySelector('[data-key="total"]').classList.toggle('zero', totThem === 0);
    themContainer.querySelector('[data-key="denari"] .value').textContent = statsThem.denari;
    themContainer.querySelector('[data-key="denari"]').classList.toggle('zero', statsThem.denari === 0);
    themContainer.querySelector('[data-key="carte"] .value').textContent = statsThem.numCarte;
    themContainer.querySelector('[data-key="carte"]').classList.toggle('zero', statsThem.numCarte === 0);

    // Primiera LORO: "1" se vinta, altrimenti valore parziale
    let priThemDisplay;
    if (vinc.primieraVinta === 'them') priThemDisplay = 1;
    else priThemDisplay = statsThem.primieraValore;
    themContainer.querySelector('[data-key="primiera"] .value').textContent = priThemDisplay;
    themContainer.querySelector('[data-key="primiera"]').classList.toggle('zero', priThemDisplay === 0);

    // ── Footer NOI ──
    const usContainer = document.getElementById('stats-us');
    const totUs = (statsUs.hasSettebello ? 1 : 0)
                + (vinc.carteVinte === 'us' ? 1 : 0)
                + (vinc.denariVinti === 'us' ? 1 : 0)
                + (vinc.primieraVinta === 'us' ? 1 : 0);
    usContainer.querySelector('[data-key="total"] .value').textContent = totUs;
    usContainer.querySelector('[data-key="total"]').classList.toggle('zero', totUs === 0);
    usContainer.querySelector('[data-key="denari"] .value').textContent = statsUs.denari;
    usContainer.querySelector('[data-key="denari"]').classList.toggle('zero', statsUs.denari === 0);
    usContainer.querySelector('[data-key="carte"] .value').textContent = statsUs.numCarte;
    usContainer.querySelector('[data-key="carte"]').classList.toggle('zero', statsUs.numCarte === 0);

    let priUsDisplay;
    if (vinc.primieraVinta === 'us') priUsDisplay = 1;
    else priUsDisplay = statsUs.primieraValore;
    usContainer.querySelector('[data-key="primiera"] .value').textContent = priUsDisplay;
    usContainer.querySelector('[data-key="primiera"]').classList.toggle('zero', priUsDisplay === 0);

    // ── Riga centrale: miniature ──
    renderPrimieraRow('primiera-us', statsUs);
    renderPrimieraRow('primiera-them', statsThem);
  }

  function renderPrimieraRow(containerId, stats) {
    const container = document.getElementById(containerId);
    SUITS_ORDER.forEach(suit => {
      const cell = container.querySelector(`.primiera-cell[data-suit="${suit}"]`);
      if (!cell) return;

      // Reset
      cell.innerHTML = '';
      cell.classList.remove('won', 'empty');

      const b = stats.bestPerSuit[suit];
      if (b) {
        const img = document.createElement('img');
        img.src = `${b.row} ${suit}.jpg`;
        img.alt = `${b.row} di ${suit}`;
        img.draggable = false;
        img.onerror = function() {
          this.remove();
          cell.textContent = `${b.row}${SUIT_ICONS[suit]}`;
          cell.style.color = '#fbbf24';
          cell.style.fontWeight = 'bold';
          cell.style.fontSize = '0.6rem';
        };
        cell.appendChild(img);
        if (b.row === MAX_ROW) cell.classList.add('won');
      } else {
        cell.classList.add('empty');
      }
    });
  }

  // ═══════════════════════════════════════════════
  //  RESET / SALVATAGGIO
  // ═══════════════════════════════════════════════
  function resetAll() {
    if (!confirm('Azzerare tutto?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStates));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === cardStates.length) {
        cardStates = arr;
        cardStates.forEach((stato, index) => applicaStato(index, stato));
      }
    } catch(e) { console.warn('Errore caricamento stato', e); }
  }

  // ═══════════════════════════════════════════════
  //  HINT
  // ═══════════════════════════════════════════════
  function showHintOnce() {
    if (localStorage.getItem('scopa_mono_hint_v8')) return;
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => {
      hint.classList.remove('show');
      localStorage.setItem('scopa_mono_hint_v8', '1');
    }, 6000);
  }

  // ═══════════════════════════════════════════════
  //  AVVIO
  // ═══════════════════════════════════════════════
  loadState();
  ricalcolaPunteggi();
  showHintOnce();
</script>

</body>
