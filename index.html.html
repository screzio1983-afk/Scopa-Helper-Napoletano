<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Segnapunti Scopa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 4px;
    user-select: none;
  }

  /* ── HEADER (avversario) ── */
  .header {
    flex: 0 0 auto;
    background: #2a1a1a;
    border: 1.5px solid #7f1d1d;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .header .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }

  .header .title {
    font-size: 0.7rem;
    color: #f87171;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── GRIGLIA CARTE ── */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
    min-height: 0;
  }

  .card {
    border: 1.5px solid #444;
    background: #2a2a3e;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 0;
    transition: transform 0.1s ease, box-shadow 0.15s ease,
                background 0.15s ease, border-color 0.15s ease;
    touch-action: none;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
    pointer-events: none;
    transition: opacity 0.15s ease, filter 0.15s ease;
  }

  /* Carta uscita: annerita MA ancora leggibile */
  .card.discarded {
    background: #3a3a4a;
    border-color: #3a3a4a;
  }

  .card.discarded img {
    opacity: 0.55;
    filter: brightness(0.5) grayscale(0.4);
  }

  /* Carta presa da NOI (verde) */
  .card.taken-us {
    background: #14532d;
    border-color: #22c55e;
    box-shadow: inset 0 0 10px rgba(34,197,94,0.6);
  }

  .card.taken-us img { opacity: 0; }

  /* Carta presa dall'AVVERSARIO (rosso) */
  .card.taken-them {
    background: #4c1d1d;
    border-color: #ef4444;
    box-shadow: inset 0 0 10px rgba(239,68,68,0.6);
  }

  .card.taken-them img { opacity: 0; }

  /* Feedback drag */
  .card.dragging-us {
    border-color: #22c55e;
    box-shadow: 0 0 14px rgba(34,197,94,1);
    z-index: 3;
    transform: scale(0.96);
  }

  .card.dragging-them {
    border-color: #ef4444;
    box-shadow: 0 0 14px rgba(239,68,68,1);
    z-index: 3;
    transform: scale(0.96);
  }

  /* ── FOOTER (noi) ── */
  .footer {
    flex: 0 0 auto;
    background: #1a2a1a;
    border: 1.5px solid #166534;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .footer .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }

  .footer .title {
    font-size: 0.7rem;
    color: #4ade80;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── STATS ── */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 2.2fr;
    gap: 3px;
    align-items: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
  }

  .stat .icon {
    font-size: clamp(0.8rem, 3vw, 1rem);
    line-height: 1;
  }

  .stat .value {
    font-size: clamp(0.7rem, 2.8vw, 0.95rem);
    font-weight: bold;
    line-height: 1;
    color: #fbbf24;
  }

  .stat.zero .value { color: #555; }

  .stat .label {
    font-size: 0.5rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Primiera: 4 mini-icone dei semi con valore */
  .primiera-box {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    background: rgba(0,0,0,0.25);
    border-radius: 5px;
    padding: 2px;
  }

  .primiera-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0px;
    min-width: 0;
    padding: 2px 0;
    border-radius: 4px;
    transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    border: 1px solid transparent;
  }

  .primiera-cell .suit-icon {
    font-size: clamp(0.65rem, 2.4vw, 0.85rem);
    line-height: 1;
  }

  .primiera-cell .card-val {
    font-size: clamp(0.65rem, 2.6vw, 0.9rem);
    font-weight: bold;
    line-height: 1;
    color: #fbbf24;
    min-height: 0.9em;
  }

  .primiera-cell.empty .card-val { color: #444; }

  /* Cella "vinta matematicamente" (hai il 7 di quel seme) */
  .primiera-cell.won {
    background: #14532d;
    border-color: #22c55e;
    box-shadow: 0 0 8px rgba(34,197,94,0.7);
  }

  .primiera-cell.won .card-val {
    color: #22c55e;
    text-shadow: 0 0 6px rgba(34,197,94,0.9);
  }

  /* Stessa cosa ma per l'avversario: resta verde, è universale */
  .header .primiera-cell.won {
    background: #14532d;
    border-color: #22c55e;
    box-shadow: 0 0 8px rgba(34,197,94,0.7);
  }

  /* ── RESET ── */
  .reset-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
  }

  .reset-bar button {
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.68rem;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ── HINT ── */
  .hint {
    position: fixed;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    background: rgba(0,0,0,0.92);
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    text-align: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    line-height: 1.7;
    border: 1px solid #444;
  }

  .hint.show { opacity: 1; }

  .hint b { color: #fbbf24; }
</style>
</head>
<body>

  <!-- ═══ HEADER: AVVERSARIO ═══ -->
  <div class="header">
    <div class="title-row">
      <span class="title">▼ LORO</span>
    </div>
    <div class="stats" id="stats-them"></div>
  </div>

  <!-- ═══ GRIGLIA ═══ -->
  <div class="grid" id="grid"></div>

  <!-- ═══ FOOTER: NOI ═══ -->
  <div class="footer">
    <div class="stats" id="stats-us"></div>
    <div class="title-row">
      <span class="title">▲ NOI</span>
    </div>
  </div>

  <!-- ═══ RESET ═══ -->
  <div class="reset-bar">
    <button onclick="resetAll()">RESET</button>
  </div>

  <!-- HINT -->
  <div class="hint" id="hint">
    <b>Tap</b> = carta uscita<br>
    <b>Trascina giù ↓</b> = presa nostra<br>
    <b>Trascina su ↑</b> = presa loro
  </div>

<script>
  // ═══════════════════════════════════════════════
  //  CONFIGURAZIONE
  // ═══════════════════════════════════════════════
  const SUITS = ['DENARI', 'COPPE', 'SPADE', 'BASTONI'];
  const SUIT_ICONS = { DENARI: '🪙', COPPE: '🏆', SPADE: '⚔️', BASTONI: '🪵' };
  const SUITS_ORDER = ['SPADE', 'COPPE', 'BASTONI', 'DENARI'];
  const ROWS = 10;
  const COLS = 4;
  const STORAGE_KEY = 'scopa_mono_v5';
  const DRAG_THRESHOLD = 25;

  const PRIMIERA_VALUE = {
    1: 16, 2: 12, 3: 13, 4: 14, 5: 15, 6: 18, 7: 21,
    8: 10, 9: 10, 10: 10
  };

  // Il valore massimo possibile per la primiera in un seme è il 7 (21 punti).
  // Se un giocatore ha il 7 di un seme, quel seme è "matematicamente vinto"
  // → nessun altro potrà mai superarlo.
  const MAX_ROW = 7;

  // ═══════════════════════════════════════════════
  //  STATO
  // ═══════════════════════════════════════════════
  let cardStates = new Array(ROWS * COLS).fill(0);
  // 0 = nuova, 1 = uscita, 2 = presa da NOI, 3 = presa da LORO

  // ═══════════════════════════════════════════════
  //  UTILITÀ
  // ═══════════════════════════════════════════════
  function cardInfo(index) {
    const row = Math.floor(index / COLS) + 1;
    const col = index % COLS;
    return { row, col, suit: SUITS[col] };
  }

  function cardFileName(index) {
    const { row, suit } = cardInfo(index);
    return `${row} ${suit}.jpg`;
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE GRIGLIA
  // ═══════════════════════════════════════════════
  const grid = document.getElementById('grid');
  const fragment = document.createDocumentFragment();

  for (let row = 1; row <= ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const index = (row - 1) * COLS + col;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const img = document.createElement('img');
      img.src = cardFileName(index);
      img.alt = `${row} ${SUITS[col]}`;
      img.onerror = function() {
        this.style.display = 'none';
        card.style.background = '#333';
        card.style.color = '#fff';
        card.style.fontSize = '0.55rem';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.justifyContent = 'center';
        card.textContent = `${row}\n${SUITS[col].slice(0,3)}`;
        card.style.whiteSpace = 'pre-line';
      };
      card.appendChild(img);

      attachHandlers(card, index);
      fragment.appendChild(card);
    }
  }
  grid.appendChild(fragment);

  const allCards = () => document.querySelectorAll('.card');

  // ═══════════════════════════════════════════════
  //  TAP / DRAG
  // ═══════════════════════════════════════════════
  function attachHandlers(card, index) {
    let startX = 0, startY = 0;
    let tracking = false;
    let dragMode = null;

    const onPointerDown = (e) => {
      if (cardStates[index] !== 0) return;
      tracking = true;
      dragMode = null;
      startX = e.clientX;
      startY = e.clientY;
      card.setPointerCapture(e.pointerId);
    };

    const onPointerMove = (e) => {
      if (!tracking) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const dist = Math.hypot(dx, dy);

      if (dist > DRAG_THRESHOLD) {
        const mode = dy > 0 ? 'us' : 'them';
        if (mode !== dragMode) {
          card.classList.remove('dragging-us', 'dragging-them');
          dragMode = mode;
          card.classList.add(mode === 'us' ? 'dragging-us' : 'dragging-them');
        }
      } else if (dragMode) {
        card.classList.remove('dragging-us', 'dragging-them');
        dragMode = null;
      }
    };

    const onPointerUp = (e) => {
      if (!tracking) return;
      tracking = false;
      card.classList.remove('dragging-us', 'dragging-them');

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const dist = Math.hypot(dx, dy);

      if (dist <= DRAG_THRESHOLD) {
        applicaStato(index, 1);       // tap → uscita
      } else if (dy > 0) {
        applicaStato(index, 2);       // giù → noi
      } else {
        applicaStato(index, 3);       // su → loro
      }

      dragMode = null;
      ricalcolaPunteggi();
      saveState();
    };

    const onPointerCancel = () => {
      tracking = false;
      dragMode = null;
      card.classList.remove('dragging-us', 'dragging-them');
    };

    card.addEventListener('pointerdown', onPointerDown);
    card.addEventListener('pointermove', onPointerMove);
    card.addEventListener('pointerup', onPointerUp);
    card.addEventListener('pointercancel', onPointerCancel);
    card.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function applicaStato(index, nuovoStato) {
    cardStates[index] = nuovoStato;
    const el = allCards()[index];
    if (!el) return;

    el.classList.remove('discarded', 'taken-us', 'taken-them');
    if (nuovoStato === 1) el.classList.add('discarded');
    else if (nuovoStato === 2) el.classList.add('taken-us');
    else if (nuovoStato === 3) el.classList.add('taken-them');
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE STATS
  // ═══════════════════════════════════════════════
  function buildStatsFor(containerId, chi) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    // 2 statistiche semplici: Ori, Carte
    const items = [
      { key: 'denari', icon: '🪙', label: 'Ori'   },
      { key: 'carte',  icon: '🃏', label: 'Carte' }
    ];

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'stat zero';
      div.dataset.player = chi;
      div.dataset.key = item.key;

      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = item.icon;

      const val = document.createElement('div');
      val.className = 'value';
      val.textContent = '0';

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = item.label;

      div.appendChild(icon);
      div.appendChild(val);
      div.appendChild(lab);
      container.appendChild(div);
    });

    // Primiera: 4 celle (una per seme)
    const priBox = document.createElement('div');
    priBox.className = 'primiera-box';
    priBox.dataset.player = chi;
    priBox.dataset.key = 'primiera';

    SUITS_ORDER.forEach(suit => {
      const cell = document.createElement('div');
      cell.className = 'primiera-cell empty';
      cell.dataset.suit = suit;
      cell.dataset.player = chi;

      const si = document.createElement('div');
      si.className = 'suit-icon';
      si.textContent = SUIT_ICONS[suit];

      const cv = document.createElement('div');
      cv.className = 'card-val';
      cv.textContent = '—';

      cell.appendChild(si);
      cell.appendChild(cv);
      priBox.appendChild(cell);
    });

    container.appendChild(priBox);
  }

  buildStatsFor('stats-them', 3);
  buildStatsFor('stats-us', 2);

  // ═══════════════════════════════════════════════
  //  CALCOLO STATS
  // ═══════════════════════════════════════════════
  function calcolaStats(chi) {
    let denari = 0;
    let numCarte = 0;
    const bestPerSuit = { DENARI: null, COPPE: null, SPADE: null, BASTONI: null };

    cardStates.forEach((stato, index) => {
      if (stato !== chi) return;
      const { row, col, suit } = cardInfo(index);
      numCarte++;
      if (suit === 'DENARI') denari++;

      const val = PRIMIERA_VALUE[row] || 0;
      if (!bestPerSuit[suit] || val > bestPerSuit[suit].value) {
        bestPerSuit[suit] = { value: val, row, suit };
      }
    });

    return { denari, numCarte, bestPerSuit };
  }

  function ricalcolaPunteggi() {
    [2, 3].forEach(chi => {
      const s = calcolaStats(chi);
      const containerId = chi === 2 ? 'stats-us' : 'stats-them';
      const container = document.getElementById(containerId);

      // Ori
      const ori = container.querySelector(`.stat[data-key="denari"]`);
      if (ori) {
        ori.querySelector('.value').textContent = s.denari;
        ori.classList.toggle('zero', s.denari === 0);
      }

      // Carte
      const carte = container.querySelector(`.stat[data-key="carte"]`);
      if (carte) {
        carte.querySelector('.value').textContent = s.numCarte;
        carte.classList.toggle('zero', s.numCarte === 0);
      }

      // Primiera: per seme mostra la carta più alta + evidenzia se vinta (7)
      SUITS_ORDER.forEach(suit => {
        const cell = container.querySelector(`.primiera-cell[data-suit="${suit}"]`);
        if (!cell) return;
        const b = s.bestPerSuit[suit];
        const valEl = cell.querySelector('.card-val');
        if (b) {
          valEl.textContent = b.row;
          cell.classList.remove('empty');
          // Evidenzia in verde se hai il 7 (massimo possibile → vinto matematicamente)
          cell.classList.toggle('won', b.row === MAX_ROW);
        } else {
          valEl.textContent = '—';
          cell.classList.add('empty');
          cell.classList.remove('won');
        }
      });
    });
  }

  // ═══════════════════════════════════════════════
  //  RESET
  // ═══════════════════════════════════════════════
  function resetAll() {
    if (!confirm('Azzerare tutto?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  // ═══════════════════════════════════════════════
  //  SALVATAGGIO
  // ═══════════════════════════════════════════════
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStates));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === cardStates.length) {
        cardStates = arr;
        cardStates.forEach((stato, index) => applicaStato(index, stato));
      }
    } catch(e) { console.warn('Errore caricamento stato', e); }
  }

  // ═══════════════════════════════════════════════
  //  HINT
  // ═══════════════════════════════════════════════
  function showHintOnce() {
    if (localStorage.getItem('scopa_mono_hint_v5')) return;
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => {
      hint.classList.remove('show');
      localStorage.setItem('scopa_mono_hint_v5', '1');
    }, 6000);
  }

  // ═══════════════════════════════════════════════
  //  AVVIO
  // ═══════════════════════════════════════════════
  loadState();
  ricalcolaPunteggi();
  showHintOnce();
</script>

</body>
</html>
