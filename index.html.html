<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Segnapunti Scopa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 4px;
    user-select: none;
  }

  /* ── BARRA SUPERIORE ── */
  .topbar {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
    align-items: stretch;
  }

  .total-box {
    flex: 1 1 0;
    background: #2a2a3e;
    border: 2px solid #fbbf24;
    border-radius: 8px;
    padding: 4px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-width: 0;
  }

  .total-box .label {
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    color: #aaa;
    font-weight: bold;
    letter-spacing: 0.05em;
  }

  .total-box .value {
    font-size: clamp(1.3rem, 6vw, 1.8rem);
    color: #fbbf24;
    font-weight: bold;
    line-height: 1;
  }

  .top-buttons {
    display: flex;
    gap: 3px;
    flex: 0 0 auto;
    flex-direction: column;
  }

  .top-buttons button {
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.68rem;
    color: #fff;
    cursor: pointer;
    padding: 4px 10px;
    white-space: nowrap;
  }

  #btnReset { background: #ef4444; }

  /* ── GRIGLIA CARTE ── */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
    min-height: 0;
  }

  .card {
    border: 1.5px solid #444;
    background: #2a2a3e;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 0;
    transition: transform 0.1s ease, box-shadow 0.15s ease,
                background 0.15s ease, border-color 0.15s ease;
  }

  .card:active { transform: scale(0.93); }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
    pointer-events: none;
    transition: opacity 0.15s ease, filter 0.15s ease;
  }

  /* Stato 0: carta nuova (default) */

  /* Stato 1: carta uscita */
  .card.discarded {
    background: #15151f;
    border-color: #15151f;
  }

  .card.discarded img {
    opacity: 0.12;
    filter: grayscale(1);
  }

  /* Stato 2: carta presa (nel tuo mazzo) */
  .card.taken {
    background: #15151f;
    border-color: #22c55e;
    box-shadow: inset 0 0 10px rgba(34,197,94,0.5);
  }

  .card.taken img { opacity: 0; }

  /* Stato 3: carta scopa (presa + scopa) */
  .card.scopa {
    background: #15151f;
    border-color: #f59e0b;
    box-shadow: inset 0 0 12px rgba(245,158,11,0.7);
  }

  .card.scopa img { opacity: 0; }

  /* Piccolo badge scopa */
  .card.scopa::after {
    content: '🧹';
    position: absolute;
    bottom: 1px;
    right: 1px;
    font-size: 0.7rem;
    line-height: 1;
  }

  /* ── AZIONI ── */
  .actions {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
    height: 42px;
  }

  .actions button {
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: clamp(0.72rem, 3vw, 0.95rem);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 100%;
  }

  .actions button:active { transform: scale(0.96); filter: brightness(1.2); }

  #btnUndo { background: #475569; }

  #btnUndo:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* ── STATISTICHE ── */
  .stats {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    background: #2a2a3e;
    border-radius: 8px;
    padding: 4px 5px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
    position: relative;
  }

  .stat .icon {
    font-size: clamp(0.85rem, 3.2vw, 1.1rem);
    line-height: 1;
  }

  .stat .value {
    font-size: clamp(0.75rem, 3vw, 1rem);
    font-weight: bold;
    line-height: 1;
    color: #fbbf24;
  }

  .stat.zero .value { color: #555; }

  .stat .label {
    font-size: 0.55rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* ── BANNER ── */
  .mano-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: #f59e0b;
    color: #fff;
    padding: 14px 22px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 1rem;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .mano-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ── HINT ── */
  .hint {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    text-align: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    line-height: 1.6;
    border: 1px solid #444;
  }

  .hint.show { opacity: 1; }

  .hint b { color: #fbbf24; }
</style>
</head>
<body>

  <!-- BARRA SUPERIORE -->
  <div class="topbar">
    <div class="total-box">
      <span class="label">TOTALE</span>
      <span class="value" id="total">0</span>
    </div>
    <div class="top-buttons">
      <button id="btnReset" onclick="resetAll()">RESET</button>
    </div>
  </div>

  <!-- GRIGLIA -->
  <div class="grid" id="grid"></div>

  <!-- AZIONI -->
  <div class="actions">
    <button id="btnUndo" onclick="undo()" disabled>↶ ANNULLA</button>
  </div>

  <!-- STATISTICHE -->
  <div class="stats" id="stats"></div>

  <!-- BANNER -->
  <div class="mano-banner" id="banner"></div>

  <!-- HINT -->
  <div class="hint" id="hint">
    <b>1° tocco</b> = carta uscita<br>
    <b>2° tocco</b> = carta presa<br>
    <b>3° tocco</b> = scopa
  </div>

<script>
  // ═══════════════════════════════════════════════
  //  CONFIGURAZIONE
  // ═══════════════════════════════════════════════
  const SUITS = ['DENARI', 'COPPE', 'SPADE', 'BASTONI'];
  const ROWS = 10;
  const COLS = 4;
  const STORAGE_KEY = 'scopa_mono_v3';

  const PRIMIERA_VALUE = {
    1: 16, 2: 12, 3: 13, 4: 14, 5: 15, 6: 18, 7: 21,
    8: 10, 9: 10, 10: 10
  };

  // Barra statistiche (3 icone): Ori, Primiera, Carte
  const STAT_ITEMS = [
    { key: 'denari',   icon: '🪙', label: 'Ori'      },
    { key: 'primiera', icon: '🎯', label: 'Primiera' },
    { key: 'carte',    icon: '🃏', label: 'Carte'    }
  ];

  // ═══════════════════════════════════════════════
  //  STATO
  // ═══════════════════════════════════════════════
  // Ogni carta ha uno stato: 0 = nuova, 1 = uscita, 2 = presa, 3 = scopa
  let cardStates = new Array(ROWS * COLS).fill(0);

  // Cronologia per Annulla (salva stato precedente)
  let history = [];

  // ═══════════════════════════════════════════════
  //  UTILITÀ
  // ═══════════════════════════════════════════════
  function cardInfo(index) {
    const row = Math.floor(index / COLS) + 1;
    const col = index % COLS;
    return { row, col, suit: SUITS[col] };
  }

  function cardFileName(index) {
    const { row, suit } = cardInfo(index);
    return `${row} ${suit}.jpg`;
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE GRIGLIA
  // ═══════════════════════════════════════════════
  const grid = document.getElementById('grid');
  const fragment = document.createDocumentFragment();

  for (let row = 1; row <= ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const index = (row - 1) * COLS + col;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const img = document.createElement('img');
      img.src = cardFileName(index);
      img.alt = `${row} ${SUITS[col]}`;
      img.onerror = function() {
        this.style.display = 'none';
        card.style.background = '#333';
        card.style.color = '#fff';
        card.style.fontSize = '0.55rem';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.justifyContent = 'center';
        card.textContent = `${row}\n${SUITS[col].slice(0,3)}`;
        card.style.whiteSpace = 'pre-line';
      };
      card.appendChild(img);

      card.addEventListener('click', () => ciclaStato(index));
      card.addEventListener('contextmenu', (e) => e.preventDefault());
      fragment.appendChild(card);
    }
  }
  grid.appendChild(fragment);

  const allCards = () => document.querySelectorAll('.card');

  // ═══════════════════════════════════════════════
  //  CICLO DI STATO: nuova → uscita → presa → scopa → (torna a nuova? no)
  // ═══════════════════════════════════════════════
  // 1° click: 0 → 1 (uscita)
  // 2° click: 1 → 2 (presa)
  // 3° click: 2 → 3 (scopa)
  // 4° click: 3 → 0 (ripristino? Sì, per correggere errori)
  // ═══════════════════════════════════════════════
  function ciclaStato(index) {
    const vecchio = cardStates[index];
    const nuovo = (vecchio + 1) % 4;

    history.push({ index, vecchio });
    if (history.length > 200) history.shift();

    applicaStato(index, nuovo);
    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();

    if (navigator.vibrate) {
      if (nuovo === 3) navigator.vibrate([30, 30, 30]); // scopa
      else if (nuovo === 2) navigator.vibrate(30);       // presa
      else navigator.vibrate(10);                        // uscita
    }

    if (nuovo === 3) showBanner('🧹 Scopa!');
  }

  function applicaStato(index, nuovo) {
    cardStates[index] = nuovo;
    const el = allCards()[index];
    if (!el) return;

    el.classList.remove('discarded', 'taken', 'scopa');
    if (nuovo === 1) el.classList.add('discarded');
    else if (nuovo === 2) el.classList.add('taken');
    else if (nuovo === 3) el.classList.add('scopa');
  }

  // ═══════════════════════════════════════════════
  //  UNDO
  // ═══════════════════════════════════════════════
  function aggiornaUndo() {
    document.getElementById('btnUndo').disabled = history.length === 0;
  }

  function undo() {
    if (history.length === 0) return;
    const azione = history.pop();
    applicaStato(azione.index, azione.vecchio);
    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();
  }

  // ═══════════════════════════════════════════════
  //  STATISTICHE
  // ═══════════════════════════════════════════════
  function buildStats() {
    const container = document.getElementById('stats');
    container.innerHTML = '';
    STAT_ITEMS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'stat zero';
      div.id = 'stat-' + item.key;
      div.title = item.label;

      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = item.icon;

      const val = document.createElement('div');
      val.className = 'value';
      val.id = 'val-' + item.key;
      val.textContent = '0';

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = item.label;

      div.appendChild(icon);
      div.appendChild(val);
      div.appendChild(lab);
      container.appendChild(div);
    });
  }
  buildStats();

  // ═══════════════════════════════════════════════
  //  CALCOLO
  // ═══════════════════════════════════════════════
  // Carte "mie" = stato 2 (presa) o 3 (scopa)
  // Carte "uscite" = stato 1 (uscita)
  // Scope = numero di carte in stato 3
  // ═══════════════════════════════════════════════
  function calcolaStats() {
    let denari = 0;
    let numCarte = 0;
    let numScope = 0;
    let hasSettebello = false;

    const bestPerSuitMie = [null, null, null, null];
    const bestPerSuitUscite = [null, null, null, null];

    cardStates.forEach((stato, index) => {
      const { row, col, suit } = cardInfo(index);
      const val = PRIMIERA_VALUE[row] || 0;

      if (stato === 2 || stato === 3) {
        // Carta mia
        numCarte++;
        if (stato === 3) numScope++;
        if (suit === 'DENARI') {
          denari++;
          if (row === 7) hasSettebello = true;
        }
        if (!bestPerSuitMie[col] || val > bestPerSuitMie[col].value) {
          bestPerSuitMie[col] = { value: val, row, suit };
        }
      } else if (stato === 1) {
        // Carta uscita (dell'avversario)
        if (!bestPerSuitUscite[col] || val > bestPerSuitUscite[col].value) {
          bestPerSuitUscite[col] = { value: val, row, suit };
        }
      }
    });

    // Primiera: +1 se in OGNI seme la mia carta più alta batte quella uscita.
    // Considero solo i semi in cui ho almeno una carta.
    // Se in un seme non ho carte → non posso vincere la primiera.
    let primieraVinta = false;
    let semiValidi = 0;
    let semiVinti = 0;

    for (let col = 0; col < 4; col++) {
      const mia = bestPerSuitMie[col];
      if (!mia) continue; // non ho carte di questo seme
      semiValidi++;
      const sua = bestPerSuitUscite[col];
      if (!sua || mia.value > sua.value) {
        semiVinti++;
      }
    }
    // Primiera valida solo se ho tutti e 4 i semi e li vinco tutti
    primieraVinta = (semiValidi === 4 && semiVinti === 4);

    // Valore primiera (solo per display, somma delle mie carte migliori)
    const primieraValore = bestPerSuitMie.reduce((sum, b) => sum + (b ? b.value : 0), 0);

    return {
      denari,
      numCarte,
      numScope,
      hasSettebello,
      primieraValore,
      primieraVinta
    };
  }

  function ricalcolaPunteggi() {
    const s = calcolaStats();

    // Barra statistiche
    const valori = {
      denari:   s.denari,
      primiera: s.primieraVinta ? 1 : 0,   // 1 se vinta, 0 altrimenti
      carte:    s.numCarte
    };

    STAT_ITEMS.forEach(item => {
      const v = valori[item.key];
      const el = document.getElementById('val-' + item.key);
      const wrap = document.getElementById('stat-' + item.key);
      if (el) el.textContent = v;
      if (wrap) wrap.classList.toggle('zero', v === 0);
    });

    // Totale
    const punti = (s.hasSettebello ? 1 : 0)
                + (s.numCarte >= 21 ? 1 : 0)
                + (s.primieraVinta ? 1 : 0)
                + s.numScope;

    document.getElementById('total').textContent = punti;
  }

  // ═══════════════════════════════════════════════
  //  RESET
  // ═══════════════════════════════════════════════
  function resetAll() {
    if (!confirm('Azzerare tutto?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  // ═══════════════════════════════════════════════
  //  SALVATAGGIO
  // ═══════════════════════════════════════════════
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStates));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === cardStates.length) {
        cardStates = arr;
        cardStates.forEach((stato, index) => {
          applicaStato(index, stato);
        });
      }
    } catch(e) { console.warn('Errore caricamento stato', e); }
  }

  // ═══════════════════════════════════════════════
  //  BANNER + HINT
  // ═══════════════════════════════════════════════
  function showBanner(text) {
    const b = document.getElementById('banner');
    b.textContent = text;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 1100);
  }

  function showHintOnce() {
    if (localStorage.getItem('scopa_mono_hint_v3')) return;
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => {
      hint.classList.remove('show');
      localStorage.setItem('scopa_mono_hint_v3', '1');
    }, 5500);
  }

  // ═══════════════════════════════════════════════
  //  AVVIO
  // ═══════════════════════════════════════════════
  loadState();
  ricalcolaPunteggi();
  aggiornaUndo();
  showHintOnce();
</script>

</body>
</html>
