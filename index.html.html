<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Segnapunti Scopa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 3px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── HEADER COMPATTO (avversario) ── */
  .header {
    flex: 0 0 auto;
    background: #2a1a1a;
    border: 1.5px solid #7f1d1d;
    border-radius: 6px;
    padding: 3px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.72rem;
    line-height: 1;
  }

  .header .stats {
    display: flex;
    gap: 12px;
    align-items: center;
    flex: 1 1 auto;
    justify-content: space-around;
  }

  /* ── FOOTER COMPATTO (noi) ── */
  .footer {
    flex: 0 0 auto;
    background: #1a2a1a;
    border: 1.5px solid #166534;
    border-radius: 6px;
    padding: 3px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.72rem;
    line-height: 1;
  }

  .footer .stats {
    display: flex;
    gap: 12px;
    align-items: center;
    flex: 1 1 auto;
    justify-content: space-around;
  }

  /* Stat singola */
  .stat {
    display: flex;
    align-items: baseline;
    gap: 4px;
    white-space: nowrap;
  }

  .stat .label {
    font-size: 0.62rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .stat .value {
    font-size: 0.85rem;
    font-weight: bold;
    color: #fbbf24;
  }

  .stat.zero .value { color: #555; }

  .stat.total .value {
    font-size: 1.05rem;
    color: #fbbf24;
    text-shadow: 0 0 6px rgba(251,191,36,0.5);
  }

  .stat.primiera .value { color: #a78bfa; }
  .stat.primiera.zero .value { color: #555; }

  /* ── GRIGLIA CARTE ── */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
    min-height: 0;
  }

  .card {
    border: 1.5px solid #444;
    background: #2a2a3e;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 0;
    transition: transform 0.1s ease, box-shadow 0.15s ease,
                background 0.15s ease, border-color 0.15s ease,
                opacity 0.25s ease;
    touch-action: none;
    -webkit-user-drag: none;
    will-change: transform;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
    pointer-events: none;
    -webkit-user-drag: none;
    transition: opacity 0.15s ease, filter 0.15s ease;
  }

  .card.discarded { background: #3a3a4a; border-color: #3a3a4a; }
  .card.discarded img { opacity: 0.55; filter: brightness(0.5) grayscale(0.4); }

  .card.taken-us {
    background: #14532d;
    border-color: #22c55e;
    box-shadow: inset 0 0 10px rgba(34,197,94,0.6);
    cursor: default;
  }
  .card.taken-us img { opacity: 0; }

  .card.taken-them {
    background: #4c1d1d;
    border-color: #ef4444;
    box-shadow: inset 0 0 10px rgba(239,68,68,0.6);
    cursor: default;
  }
  .card.taken-them img { opacity: 0; }

  .card.dragging {
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    z-index: 50;
    cursor: grabbing;
    border-color: #fbbf24;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 16px rgba(251,191,36,0.8);
  }
  .card.dragging-us {
    border-color: #22c55e;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(34,197,94,1);
  }
  .card.dragging-them {
    border-color: #ef4444;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(239,68,68,1);
  }

  /* ── RIGHE PRIMIERA ── */
  .primiera-row {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 1px 0;
  }

  .primiera-row .side-label {
    font-size: 0.65rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    flex: 0 0 auto;
    min-width: 38px;
  }

  #primiera-them .side-label { color: #f87171; }
  #primiera-us .side-label { color: #4ade80; }

  .primiera-cards {
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }

  .primiera-cell {
    aspect-ratio: 2 / 3;
    max-height: 40px;
    max-width: 26px;
    width: 100%;
    border-radius: 3px;
    border: 1px solid #3a3a4a;
    background: rgba(0,0,0,0.3);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    flex: 0 0 auto;
  }

  .primiera-cell.empty {
    border-style: dashed;
    border-color: #333;
  }

  .primiera-cell.empty::after {
    content: attr(data-suit-icon);
    font-size: 0.7rem;
    opacity: 0.25;
    filter: grayscale(1);
  }

  .primiera-cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
  }

  .primiera-cell.won {
    border-color: #22c55e;
    box-shadow: 0 0 6px rgba(34,197,94,0.9);
  }

  #primiera-them .primiera-cell:not(.empty) { border-color: #7f1d1d; }
  #primiera-them .primiera-cell.won { border-color: #22c55e; }

  #primiera-us .primiera-cell:not(.empty) { border-color: #166534; }

  /* ── BARRA AZIONI (reset + undo) ── */
  .actions-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
    gap: 4px;
  }

  .actions-bar button {
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.65rem;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease, filter 0.15s ease;
  }

  .actions-bar button:active { filter: brightness(1.2); }

  #btnUndo { background: #475569; color: #fff; }
  #btnUndo:disabled { opacity: 0.35; cursor: not-allowed; }

  #btnReset { background: #ef4444; color: #fff; }

  /* ── HINT ── */
  .hint {
    position: fixed;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    background: rgba(0,0,0,0.92);
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    text-align: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    line-height: 1.7;
    border: 1px solid #444;
  }
  .hint.show { opacity: 1; }
  .hint b { color: #fbbf24; }
</style>
</head>
<body>

  <!-- HEADER: LORO -->
  <div class="header">
    <div class="stats" id="stats-them"></div>
  </div>

  <!-- PRIMIERA LORO -->
  <div class="primiera-row" id="primiera-them">
    <span class="side-label">Loro</span>
    <div class="primiera-cards" id="primiera-them-cards"></div>
  </div>

  <!-- GRIGLIA -->
  <div class="grid" id="grid"></div>

  <!-- PRIMIERA NOI -->
  <div class="primiera-row" id="primiera-us">
    <span class="side-label">Noi</span>
    <div class="primiera-cards" id="primiera-us-cards"></div>
  </div>

  <!-- FOOTER: NOI -->
  <div class="footer">
    <div class="stats" id="stats-us"></div>
  </div>

  <!-- AZIONI -->
  <div class="actions-bar">
    <button id="btnUndo" onclick="undo()" disabled>↶ ANNULLA</button>
    <button id="btnReset" onclick="resetAll()">RESET</button>
  </div>

  <!-- HINT -->
  <div class="hint" id="hint">
    <b>Tap</b> = carta uscita<br>
    <b>Trascina giù ↓</b> = presa nostra<br>
    <b>Trascina su ↑</b> = presa loro
  </div>

<script>
  // ═══════════════════════════════════════════════
  //  CONFIGURAZIONE
  // ═══════════════════════════════════════════════
  const SUITS = ['DENARI', 'COPPE', 'SPADE', 'BASTONI'];
  const SUIT_ICONS = { DENARI: '🪙', COPPE: '🏆', SPADE: '⚔️', BASTONI: '🪵' };
  const SUITS_ORDER = ['SPADE', 'COPPE', 'BASTONI', 'DENARI'];
  const ROWS = 10;
  const COLS = 4;
  const STORAGE_KEY = 'scopa_mono_v11';
  const DRAG_THRESHOLD = 12;
  const MAX_ROW = 7;
  const FLY_DURATION = 350;

  // Soglie punti
  const SOGLIA_ORI = 6;
  const SOGLIA_CARTE = 21;
  const SOGLIA_PRIMIERA = 84;

  const PRIMIERA_VALUE = {
    1: 16, 2: 12, 3: 13, 4: 14, 5: 15, 6: 18, 7: 21,
    8: 10, 9: 10, 10: 10
  };

  let cardStates = new Array(ROWS * COLS).fill(0);
  // 0 = nuova, 1 = uscita, 2 = presa da NOI, 3 = presa da LORO

  // Storico per Annulla: salva lo stato precedente di ogni carta modificata
  let history = [];
  const MAX_HISTORY = 200;

  // ═══════════════════════════════════════════════
  //  UTILITÀ
  // ═══════════════════════════════════════════════
  function cardInfo(index) {
    const row = Math.floor(index / COLS) + 1;
    const col = index % COLS;
    return { row, col, suit: SUITS[col] };
  }
  function cardFileName(index) {
    const { row, suit } = cardInfo(index);
    return `${row} ${suit}.jpg`;
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE GRIGLIA
  // ═══════════════════════════════════════════════
  const grid = document.getElementById('grid');
  const fragment = document.createDocumentFragment();

  for (let row = 1; row <= ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const index = (row - 1) * COLS + col;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const img = document.createElement('img');
      img.src = cardFileName(index);
      img.alt = `${row} ${SUITS[col]}`;
      img.draggable = false;
      img.onerror = function() {
        this.style.display = 'none';
        card.style.background = '#333';
        card.style.color = '#fff';
        card.style.fontSize = '0.55rem';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.justifyContent = 'center';
        card.textContent = `${row}\n${SUITS[col].slice(0,3)}`;
        card.style.whiteSpace = 'pre-line';
      };
      card.appendChild(img);

      attachHandlers(card, index);
      fragment.appendChild(card);
    }
  }
  grid.appendChild(fragment);

  const allCards = () => document.querySelectorAll('.card');

  // ═══════════════════════════════════════════════
  //  DRAG (modificato: attivo su stato 0 e 1)
  // ═══════════════════════════════════════════════
  let activeDrag = null;

  // Una carta è draggabile se NON è già stata presa da qualcuno.
  // Quindi stati 0 (nuova) e 1 (uscita) sono draggabili.
  // Stati 2 (presa da noi) e 3 (presa da loro) sono bloccati.
  function isDraggable(index) {
    const s = cardStates[index];
    return s === 0 || s === 1;
  }

  function attachHandlers(card, index) {
    card.addEventListener('pointerdown', (e) => {
      if (!isDraggable(index)) return;
      e.preventDefault();
      startDrag(index, card, e.clientX, e.clientY);
    });

    card.addEventListener('touchstart', (e) => {
      if (window.PointerEvent) return;
      if (!isDraggable(index)) return;
      const t = e.touches[0];
      startDrag(index, card, t.clientX, t.clientY);
      e.preventDefault();
    }, { passive: false });

    card.addEventListener('mousedown', (e) => {
      if (window.PointerEvent) return;
      if (!isDraggable(index)) return;
      e.preventDefault();
      startDrag(index, card, e.clientX, e.clientY);
    });

    card.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function startDrag(index, card, x, y) {
    activeDrag = { index, card, startX: x, startY: y, mode: null };
    card.classList.add('dragging');
  }

  function updateDrag(x, y) {
    if (!activeDrag) return;
    const dx = x - activeDrag.startX;
    const dy = y - activeDrag.startY;
    const dist = Math.hypot(dx, dy);

    activeDrag.card.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;

    if (dist > DRAG_THRESHOLD) {
      const mode = dy > 0 ? 'us' : 'them';
      if (mode !== activeDrag.mode) {
        activeDrag.card.classList.remove('dragging-us', 'dragging-them');
        activeDrag.mode = mode;
        activeDrag.card.classList.add(mode === 'us' ? 'dragging-us' : 'dragging-them');
      }
    } else if (activeDrag.mode) {
      activeDrag.card.classList.remove('dragging-us', 'dragging-them');
      activeDrag.mode = null;
    }
  }

  function endDrag(x, y) {
    if (!activeDrag) return;
    const { index, card, startX, startY } = activeDrag;
    const statoIniziale = cardStates[index];

    const dx = x - startX;
    const dy = y - startY;
    const dist = Math.hypot(dx, dy);

    card.classList.remove('dragging', 'dragging-us', 'dragging-them');

    // Tap (senza drag significativo)
    if (dist <= DRAG_THRESHOLD) {
      card.style.transform = '';
      activeDrag = null;

      // Tap: solo su carta nuova (stato 0) diventa uscita.
      // Tap su carta già uscita (stato 1): non fa nulla
      // (potrebbe anche tornare a nuova, ma preferiamo non cambiare nulla
      // per evitare tap accidentali su carte già scartate)
      if (statoIniziale === 0) {
        registraStorico(index, statoIniziale);
        applicaStato(index, 1);
        ricalcolaPunteggi();
        saveState();
      }
      return;
    }

    // Drag: assegna a noi (giù) o a loro (su)
    const targetY = dy > 0 ? dy + 200 : dy - 200;
    card.style.transform = `translate(${dx}px, ${targetY}px) scale(0.6)`;

    const nuovoStato = dy > 0 ? 2 : 3;

    registraStorico(index, statoIniziale);
    applicaStato(index, nuovoStato);

    setTimeout(() => { card.style.transform = ''; }, FLY_DURATION);

    activeDrag = null;
    ricalcolaPunteggi();
    saveState();
  }

  function cancelDrag() {
    if (activeDrag) {
      activeDrag.card.classList.remove('dragging', 'dragging-us', 'dragging-them');
      activeDrag.card.style.transform = '';
      activeDrag = null;
    }
  }

  // Listener globali
  document.addEventListener('pointermove', (e) => {
    if (!activeDrag) return;
    updateDrag(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', (e) => {
    if (!activeDrag) return;
    endDrag(e.clientX, e.clientY);
  });
  document.addEventListener('pointercancel', cancelDrag);

  document.addEventListener('touchmove', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    const t = e.touches[0];
    updateDrag(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    const t = e.changedTouches[0];
    endDrag(t.clientX, t.clientY);
  });
  document.addEventListener('touchcancel', () => {
    if (window.PointerEvent) return;
    cancelDrag();
  });

  document.addEventListener('mousemove', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    updateDrag(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    endDrag(e.clientX, e.clientY);
  });

  // ═══════════════════════════════════════════════
  //  STATO
  // ═══════════════════════════════════════════════
  function applicaStato(index, nuovoStato) {
    cardStates[index] = nuovoStato;
    const el = allCards()[index];
    if (!el) return;

    el.classList.remove('discarded', 'taken-us', 'taken-them');
    if (nuovoStato === 1) el.classList.add('discarded');
    else if (nuovoStato === 2) el.classList.add('taken-us');
    else if (nuovoStato === 3) el.classList.add('taken-them');
  }

  // ═══════════════════════════════════════════════
  //  STORICO / UNDO
  // ═══════════════════════════════════════════════
  function registraStorico(index, statoPrecedente) {
    history.push({ index, statoPrecedente });
    if (history.length > MAX_HISTORY) history.shift();
    aggiornaUndo();
  }

  function aggiornaUndo() {
    document.getElementById('btnUndo').disabled = history.length === 0;
  }

  function undo() {
    if (history.length === 0) return;
    const azione = history.pop();
    applicaStato(azione.index, azione.statoPrecedente);
    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();
  }

  // ═══════════════════════════════════════════════
  //  STATS: costruzione
  // ═══════════════════════════════════════════════
  function buildStatsFor(containerId, chi) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    const items = [
      { key: 'total',    label: 'Tot'    },
      { key: 'denari',   label: 'Ori'    },
      { key: 'carte',    label: 'Carte'  },
      { key: 'primiera', label: 'Prim', primiera: true }
    ];

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'stat zero';
      if (item.key === 'total') div.classList.add('total');
      if (item.primiera) div.classList.add('primiera');
      div.dataset.player = chi;
      div.dataset.key = item.key;

      const lab = document.createElement('span');
      lab.className = 'label';
      lab.textContent = item.label;

      const val = document.createElement('span');
      val.className = 'value';
      val.textContent = '0';

      div.appendChild(lab);
      div.appendChild(val);
      container.appendChild(div);
    });
  }

  buildStatsFor('stats-them', 3);
  buildStatsFor('stats-us', 2);

  // ═══════════════════════════════════════════════
  //  RIGHE PRIMIERA
  // ═══════════════════════════════════════════════
  function buildPrimieraRow(containerId, chi) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    SUITS_ORDER.forEach(suit => {
      const cell = document.createElement('div');
      cell.className = 'primiera-cell empty';
      cell.dataset.suit = suit;
      cell.dataset.player = chi;
      cell.dataset.suitIcon = SUIT_ICONS[suit];
      container.appendChild(cell);
    });
  }

  buildPrimieraRow('primiera-them-cards', 3);
  buildPrimieraRow('primiera-us-cards', 2);

  // ═══════════════════════════════════════════════
  //  CALCOLO
  // ═══════════════════════════════════════════════
  function calcolaStats(chi) {
    let denari = 0;
    let numCarte = 0;
    let hasSettebello = false;
    const bestPerSuit = { DENARI: null, COPPE: null, SPADE: null, BASTONI: null };

    cardStates.forEach((stato, index) => {
      if (stato !== chi) return;
      const { row, col, suit } = cardInfo(index);
      numCarte++;
      if (suit === 'DENARI') {
        denari++;
        if (row === 7) hasSettebello = true;
      }

      const val = PRIMIERA_VALUE[row] || 0;
      if (!bestPerSuit[suit] || val > bestPerSuit[suit].value) {
        bestPerSuit[suit] = { value: val, row, suit, index };
      }
    });

    const primieraValore = Object.values(bestPerSuit).reduce(
      (sum, b) => sum + (b ? b.value : 0), 0
    );

    return { denari, numCarte, hasSettebello, bestPerSuit, primieraValore };
  }

  function ricalcolaPunteggi() {
    const statsUs = calcolaStats(2);
    const statsThem = calcolaStats(3);

    // ── LORO ──
    const themContainer = document.getElementById('stats-them');
    const puntiThem =
      (statsThem.hasSettebello ? 1 : 0) +
      (statsThem.denari >= SOGLIA_ORI ? 1 : 0) +
      (statsThem.numCarte >= SOGLIA_CARTE ? 1 : 0) +
      (statsThem.primieraValore >= SOGLIA_PRIMIERA ? 1 : 0);

    themContainer.querySelector('[data-key="total"] .value').textContent = puntiThem;
    themContainer.querySelector('[data-key="total"]').classList.toggle('zero', puntiThem === 0);
    themContainer.querySelector('[data-key="denari"] .value').textContent = statsThem.denari;
    themContainer.querySelector('[data-key="denari"]').classList.toggle('zero', statsThem.denari === 0);
    themContainer.querySelector('[data-key="carte"] .value').textContent = statsThem.numCarte;
    themContainer.querySelector('[data-key="carte"]').classList.toggle('zero', statsThem.numCarte === 0);

    const priThemDisplay = (statsThem.primieraValore >= SOGLIA_PRIMIERA) ? 1 : statsThem.primieraValore;
    themContainer.querySelector('[data-key="primiera"] .value').textContent = priThemDisplay;
    themContainer.querySelector('[data-key="primiera"]').classList.toggle('zero', priThemDisplay === 0);

    // ── NOI ──
    const usContainer = document.getElementById('stats-us');
    const puntiUs =
      (statsUs.hasSettebello ? 1 : 0) +
      (statsUs.denari >= SOGLIA_ORI ? 1 : 0) +
      (statsUs.numCarte >= SOGLIA_CARTE ? 1 : 0) +
      (statsUs.primieraValore >= SOGLIA_PRIMIERA ? 1 : 0);

    usContainer.querySelector('[data-key="total"] .value').textContent = puntiUs;
    usContainer.querySelector('[data-key="total"]').classList.toggle('zero', puntiUs === 0);
    usContainer.querySelector('[data-key="denari"] .value').textContent = statsUs.denari;
    usContainer.querySelector('[data-key="denari"]').classList.toggle('zero', statsUs.denari === 0);
    usContainer.querySelector('[data-key="carte"] .value').textContent = statsUs.numCarte;
    usContainer.querySelector('[data-key="carte"]').classList.toggle('zero', statsUs.numCarte === 0);

    const priUsDisplay = (statsUs.primieraValore >= SOGLIA_PRIMIERA) ? 1 : statsUs.primieraValore;
    usContainer.querySelector('[data-key="primiera"] .value').textContent = priUsDisplay;
    usContainer.querySelector('[data-key="primiera"]').classList.toggle('zero', priUsDisplay === 0);

    // ── Righe primiera ──
    renderPrimieraRow('primiera-them-cards', statsThem);
    renderPrimieraRow('primiera-us-cards', statsUs);
  }

  function renderPrimieraRow(containerId, stats) {
    const container = document.getElementById(containerId);
    SUITS_ORDER.forEach(suit => {
      const cell = container.querySelector(`.primiera-cell[data-suit="${suit}"]`);
      if (!cell) return;

      cell.innerHTML = '';
      cell.classList.remove('won', 'empty');

      const b = stats.bestPerSuit[suit];
      if (b) {
        const img = document.createElement('img');
        img.src = `${b.row} ${suit}.jpg`;
        img.alt = `${b.row} di ${suit}`;
        img.draggable = false;
        img.onerror = function() {
          this.remove();
          cell.textContent = `${b.row}${SUIT_ICONS[suit]}`;
          cell.style.color = '#fbbf24';
          cell.style.fontWeight = 'bold';
          cell.style.fontSize = '0.6rem';
        };
        cell.appendChild(img);
        if (b.row === MAX_ROW) cell.classList.add('won');
      } else {
        cell.classList.add('empty');
      }
    });
  }

  // ═══════════════════════════════════════════════
  //  RESET / SALVATAGGIO
  // ═══════════════════════════════════════════════
  function resetAll() {
    if (!confirm('Azzerare tutto?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStates));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === cardStates.length) {
        cardStates = arr;
        cardStates.forEach((stato, index) => applicaStato(index, stato));
      }
    } catch(e) { console.warn('Errore caricamento stato', e); }
  }

  // ═══════════════════════════════════════════════
  //  HINT
  // ═══════════════════════════════════════════════
  function showHintOnce() {
    if (localStorage.getItem('scopa_mono_hint_v11')) return;
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => {
      hint.classList.remove('show');
      localStorage.setItem('scopa_mono_hint_v11', '1');
    }, 6000);
  }

  // ═══════════════════════════════════════════════
  //  AVVIO
  // ═══════════════════════════════════════════════
  loadState();
  ricalcolaPunteggi();
  aggiornaUndo();
  showHintOnce();
</script>

</body>
