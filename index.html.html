<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Segna Punti Scopa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 4px;
    user-select: none;
  }

  /* ── TESSERE GIOCATORI ── */
  .players {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
    align-items: stretch;
  }

  .player {
    flex: 1 1 0;
    background: #2a2a3e;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 4px 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    transition: all 0.15s ease;
    min-width: 0;
  }

  .player .name {
    font-size: clamp(0.7rem, 3vw, 0.95rem);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player .score {
    font-size: clamp(1rem, 4.5vw, 1.4rem);
    color: #fbbf24;
  }

  .player.active {
    border-color: #22c55e;
    background: #1a3a26;
    box-shadow: 0 0 8px rgba(34,197,94,0.5);
  }

  .top-buttons {
    display: flex;
    gap: 3px;
    flex: 0 0 auto;
    flex-direction: column;
  }

  .top-buttons button {
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.68rem;
    color: #fff;
    cursor: pointer;
    padding: 4px 8px;
    white-space: nowrap;
  }

  #btnFineMano { background: #8b5cf6; }
  #btnReset    { background: #ef4444; }

  /* ── GRIGLIA CARTE ── */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
    min-height: 0;
  }

  .card {
    border: 1.5px solid #444;
    background: #2a2a3e;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 0;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
    touch-action: none; /* impedisce lo scroll/zoom durante il long press */
  }

  /* Feedback durante il long press: la carta si ingrandisce un po' */
  .card.pressing {
    transform: scale(0.92);
    border-color: #fbbf24;
    box-shadow: 0 0 12px rgba(251,191,36,0.9);
    z-index: 2;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
    pointer-events: none;
  }

  /* Carta presa (nel mazzo di qualcuno) */
  .card.taken {
    pointer-events: none;
    background: #15151f;
    border-color: #15151f;
  }

  .card.taken img { opacity: 0; }

  /* Carta uscita (scartata, non presa da nessuno) */
  .card.discarded {
    pointer-events: none;
    background: #15151f;
    border-color: #15151f;
  }

  .card.discarded img { opacity: 0.15; filter: grayscale(1); }

  /* ── BARRA AZIONI ── */
  .actions {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
    height: 42px;
  }

  .actions button {
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: clamp(0.72rem, 3vw, 0.95rem);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .actions button:active { transform: scale(0.96); filter: brightness(1.2); }

  #btnScopa { background: #f59e0b; flex: 2 1 0; }

  #btnUndo {
    background: #475569;
    flex: 1 1 0;
  }

  #btnUndo:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* ── STATISTICHE COMPATTE ── */
  .stats {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
    background: #2a2a3e;
    border-radius: 8px;
    padding: 4px 5px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
  }

  .stat .icon {
    font-size: clamp(0.85rem, 3.2vw, 1.1rem);
    line-height: 1;
  }

  .stat .value {
    font-size: clamp(0.75rem, 3vw, 1rem);
    font-weight: bold;
    line-height: 1;
    color: #fbbf24;
  }

  .stat.zero .value { color: #555; }

  .stat .icon.gold-seven {
    color: #fbbf24;
    font-weight: 900;
    text-shadow: 0 0 4px rgba(251,191,36,0.7);
    font-size: clamp(0.9rem, 3.6vw, 1.2rem);
  }

  /* ── BANNER ── */
  .mano-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: #8b5cf6;
    color: #fff;
    padding: 16px 24px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 1rem;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .mano-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Istruzioni iniziali */
  .hint {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.8rem;
    text-align: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    line-height: 1.4;
  }

  .hint.show { opacity: 1; }
</style>
</head>
<body>

  <!-- TESSERE GIOCATORI -->
  <div class="players">
    <div class="player active" id="p0" onclick="setActive(0)">
      <span class="name">IO</span>
      <span class="score" id="score0">0</span>
    </div>
    <div class="player" id="p1" onclick="setActive(1)">
      <span class="name">LORO</span>
      <span class="score" id="score1">0</span>
    </div>
    <div class="top-buttons">
      <button id="btnFineMano" onclick="fineMano()">FINE MANO</button>
      <button id="btnReset" onclick="resetAll()">RESET</button>
    </div>
  </div>

  <!-- GRIGLIA -->
  <div class="grid" id="grid"></div>

  <!-- AZIONI -->
  <div class="actions">
    <button id="btnScopa" onclick="segnaScopa()">🧹 SCOPA +1</button>
    <button id="btnUndo" onclick="undo()" disabled>↶ ANNULLA</button>
  </div>

  <!-- STATISTICHE COMPATTE -->
  <div class="stats" id="stats"></div>

  <!-- BANNER -->
  <div class="mano-banner" id="banner"></div>

  <!-- HINT -->
  <div class="hint" id="hint">
    <b>Tocca</b> = carta uscita<br>
    <b>Tieni premuto</b> = carta presa
  </div>

<script>
  // ═══════════════════════════════════════════════
  //  CONFIGURAZIONE
  // ═══════════════════════════════════════════════
  const SUITS = ['DENARI', 'COPPE', 'SPADE', 'BASTONI'];
  const ROWS = 10;
  const COLS = 4;
  const STORAGE_KEY = 'scopa_stato_v4';
  const LONG_PRESS_MS = 450;

  const PRIMIERA_VALUE = {
    1: 16, 2: 12, 3: 13, 4: 14, 5: 15, 6: 18, 7: 21,
    8: 10, 9: 10, 10: 10
  };

  // Voci statistiche (ordine: Denari, Primiera, Precedenti, Settebello, Carte)
  const STAT_ITEMS = [
    { key: 'denari',     icon: '🪙', label: 'Denari'     },
    { key: 'primiera',   icon: '🎯', label: 'Primiera'   },
    { key: 'precedenti', icon: '📜', label: 'Precedenti' },
    { key: 'settebello', icon: '7',  label: 'Settebello', gold: true },
    { key: 'carte',      icon: '🃏', label: 'Carte'      }
  ];

  // ═══════════════════════════════════════════════
  //  STATO
  // ═══════════════════════════════════════════════
  let state = {
    activePlayer: 0,
    manoCorrente: 0,
    taken: [
      { carte: [], scope: 0, precedenti: 0 },
      { carte: [], scope: 0, precedenti: 0 }
    ]
  };

  // Cronologia per Annulla (max 50 azioni)
  let history = [];

  // ═══════════════════════════════════════════════
  //  UTILITÀ
  // ═══════════════════════════════════════════════
  function cardInfo(index) {
    const row = Math.floor(index / COLS) + 1;
    const col = index % COLS;
    return { row, col, suit: SUITS[col] };
  }

  function cardFileName(index) {
    const { row, suit } = cardInfo(index);
    return `${row} ${suit}.jpg`;
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE GRIGLIA
  // ═══════════════════════════════════════════════
  const grid = document.getElementById('grid');
  const fragment = document.createDocumentFragment();

  for (let row = 1; row <= ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const index = (row - 1) * COLS + col;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const img = document.createElement('img');
      img.src = cardFileName(index);
      img.alt = `${row} ${SUITS[col]}`;
      img.onerror = function() {
        this.style.display = 'none';
        card.style.background = '#333';
        card.style.color = '#fff';
        card.style.fontSize = '0.55rem';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.justifyContent = 'center';
        card.textContent = `${row}\n${SUITS[col].slice(0,3)}`;
        card.style.whiteSpace = 'pre-line';
      };
      card.appendChild(img);

      attachCardHandlers(card, index);
      fragment.appendChild(card);
    }
  }
  grid.appendChild(fragment);

  const allCards = () => document.querySelectorAll('.card');

  // ═══════════════════════════════════════════════
  //  GESTIONE CLICK / LONG PRESS
  // ═══════════════════════════════════════════════
  function attachCardHandlers(card, index) {
    let pressTimer = null;
    let longPressFired = false;

    const startPress = (e) => {
      if (card.classList.contains('taken') || card.classList.contains('discarded')) return;
      longPressFired = false;
      card.classList.add('pressing');
      pressTimer = setTimeout(() => {
        longPressFired = true;
        card.classList.remove('pressing');
        eseguiPresa(index);
        if (navigator.vibrate) navigator.vibrate(30);
      }, LONG_PRESS_MS);
    };

    const cancelPress = () => {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      card.classList.remove('pressing');
    };

    const endPress = (e) => {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      card.classList.remove('pressing');
      // Se NON è stato un long press → click = uscita
      if (!longPressFired) {
        eseguiUscita(index);
        if (navigator.vibrate) navigator.vibrate(10);
      }
      longPressFired = false;
    };

    card.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startPress(e);
    });
    card.addEventListener('pointerup', endPress);
    card.addEventListener('pointercancel', cancelPress);
    card.addEventListener('pointerleave', cancelPress);
    card.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // ═══════════════════════════════════════════════
  //  AZIONI
  // ═══════════════════════════════════════════════
  function eseguiPresa(index) {
    const el = allCards()[index];
    if (!el || el.classList.contains('taken') || el.classList.contains('discarded')) return;

    const player = state.activePlayer;
    state.taken[player].carte.push(index);
    el.classList.add('taken');

    history.push({ tipo: 'presa', index, player });
    if (history.length > 50) history.shift();

    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();
  }

  function eseguiUscita(index) {
    const el = allCards()[index];
    if (!el || el.classList.contains('taken') || el.classList.contains('discarded')) return;

    el.classList.add('discarded');

    history.push({ tipo: 'uscita', index });
    if (history.length > 50) history.shift();

    aggiornaUndo();
    saveState();
  }

  function segnaScopa() {
    const player = state.activePlayer;
    state.taken[player].scope += 1;

    history.push({ tipo: 'scopa', player });
    if (history.length > 50) history.shift();

    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();

    showBanner(`🧹 Scopa per ${player === 0 ? 'IO' : 'LORO'}!`);
    if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
  }

  // ═══════════════════════════════════════════════
  //  UNDO
  // ═══════════════════════════════════════════════
  function aggiornaUndo() {
    document.getElementById('btnUndo').disabled = history.length === 0;
  }

  function undo() {
    if (history.length === 0) return;
    const azione = history.pop();
    const el = allCards()[azione.index];

    if (azione.tipo === 'presa') {
      // Rimuovi la carta dal mazzo del giocatore
      const mazzo = state.taken[azione.player].carte;
      const pos = mazzo.lastIndexOf(azione.index);
      if (pos !== -1) mazzo.splice(pos, 1);
      el.classList.remove('taken');
    } else if (azione.tipo === 'uscita') {
      el.classList.remove('discarded');
    } else if (azione.tipo === 'scopa') {
      state.taken[azione.player].scope = Math.max(0, state.taken[azione.player].scope - 1);
    }

    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();
  }

  // ═══════════════════════════════════════════════
  //  CAMBIO GIOCATORE
  // ═══════════════════════════════════════════════
  function setActive(player) {
    state.activePlayer = player;
    document.getElementById('p0').classList.toggle('active', player === 0);
    document.getElementById('p1').classList.toggle('active', player === 1);
    saveState();
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE STATISTICHE
  // ═══════════════════════════════════════════════
  function buildStats() {
    const container = document.getElementById('stats');
    container.innerHTML = '';
    STAT_ITEMS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'stat zero';
      div.id = 'stat-' + item.key;
      div.title = item.label;

      const icon = document.createElement('div');
      icon.className = 'icon' + (item.gold ? ' gold-seven' : '');
      icon.textContent = item.icon;

      const val = document.createElement('div');
      val.className = 'value';
      val.id = 'val-' + item.key;
      val.textContent = '0';

      div.appendChild(icon);
      div.appendChild(val);
      container.appendChild(div);
    });
  }
  buildStats();

  // ═══════════════════════════════════════════════
  //  CALCOLO PUNTEGGI
  // ═══════════════════════════════════════════════
  function calcolaStatsMano(player) {
    const carte = state.taken[player].carte;
    const numCarte = carte.length;
    let denari = 0;
    let hasSettebello = false;

    const bestPerSuit = [null, null, null, null];
    const suitSet = new Set();

    carte.forEach(index => {
      const { row, col, suit } = cardInfo(index);
      suitSet.add(col);
      if (suit === 'DENARI') denari++;
      if (suit === 'DENARI' && row === 7) hasSettebello = true;

      const val = PRIMIERA_VALUE[row] || 0;
      if (!bestPerSuit[col] || val > bestPerSuit[col].value) {
        bestPerSuit[col] = { value: val, row, suit };
      }
    });

    const primiera = bestPerSuit.reduce((sum, b) => sum + (b ? b.value : 0), 0);

    return {
      numCarte, denari, hasSettebello, primiera,
      bestPerSuit,
      semiCompleti: suitSet.size,
      denariPoint: 0, cartePoint: 0, primieraPoint: 0, settebelloPoint: 0
    };
  }

  function calcolaPuntiMano() {
    const stats = [calcolaStatsMano(0), calcolaStatsMano(1)];

    // Denari
    if (stats[0].denari !== stats[1].denari) {
      stats[stats[0].denari > stats[1].denari ? 0 : 1].denariPoint = 1;
    }
    // Carte
    if (stats[0].numCarte >= 21) stats[0].cartePoint = 1;
    if (stats[1].numCarte >= 21) stats[1].cartePoint = 1;
    // Primiera
    const p0Ok = stats[0].semiCompleti === 4;
    const p1Ok = stats[1].semiCompleti === 4;
    if (p0Ok && p1Ok) {
      if (stats[0].primiera > stats[1].primiera) stats[0].primieraPoint = 1;
      else if (stats[1].primiera > stats[0].primiera) stats[1].primieraPoint = 1;
    } else if (p0Ok && !p1Ok) stats[0].primieraPoint = 1;
    else if (p1Ok && !p0Ok) stats[1].primieraPoint = 1;
    // Settebello
    if (stats[0].hasSettebello) stats[0].settebelloPoint = 1;
    if (stats[1].hasSettebello) stats[1].settebelloPoint = 1;

    return stats;
  }

  function ricalcolaPunteggi() {
    const stats = calcolaPuntiMano();

    // Mostra solo i punti del giocatore 0 (IO) nella barra
    const valori = {
      denari:     stats[0].denariPoint,
      primiera:   stats[0].primieraPoint,
      precedenti: state.taken[0].precedenti,
      settebello: stats[0].settebelloPoint,
      carte:      stats[0].cartePoint
    };

    let totaleVisibile = 0;
    STAT_ITEMS.forEach(item => {
      const v = valori[item.key];
      totaleVisibile += v;
      const el = document.getElementById('val-' + item.key);
      const wrap = document.getElementById('stat-' + item.key);
      if (el) el.textContent = v;
      if (wrap) wrap.classList.toggle('zero', v === 0);
    });

    // Totale IO: visibile + scope (che non è mostrata)
    const tot0 = totaleVisibile + state.taken[0].scope;
    const tot1 = state.taken[1].precedenti
               + state.taken[1].scope
               + stats[1].settebelloPoint
               + stats[1].cartePoint
               + stats[1].denariPoint
               + stats[1].primieraPoint;

    document.getElementById('score0').textContent = tot0;
    document.getElementById('score1').textContent = tot1;
  }

  // ═══════════════════════════════════════════════
  //  FINE MANO
  // ═══════════════════════════════════════════════
  function fineMano() {
    const stats = calcolaPuntiMano();

    [0,1].forEach(p => {
      const s = stats[p];
      const puntiMano = state.taken[p].scope
                      + s.settebelloPoint + s.cartePoint
                      + s.denariPoint + s.primieraPoint;
      state.taken[p].precedenti += puntiMano;
      state.taken[p].carte = [];
      state.taken[p].scope = 0;
    });

    state.manoCorrente += 1;
    history = [];

    // Ripristina griglia
    allCards().forEach((el, i) => {
      el.classList.remove('taken', 'discarded', 'pressing');
      if (!el.querySelector('img')) {
        el.innerHTML = '';
        el.style.background = '';
        el.style.color = '';
        el.style.display = '';
        el.style.alignItems = '';
        el.style.justifyContent = '';
        el.style.whiteSpace = '';
        const img = document.createElement('img');
        img.src = cardFileName(i);
        img.alt = '';
        img.onerror = function() {
          this.style.display = 'none';
          el.style.background = '#333';
          el.style.color = '#fff';
          el.style.fontSize = '0.55rem';
          el.style.display = 'flex';
          el.style.alignItems = 'center';
          el.style.justifyContent = 'center';
          const { row, suit } = cardInfo(i);
          el.textContent = `${row}\n${suit.slice(0,3)}`;
          el.style.whiteSpace = 'pre-line';
        };
        el.appendChild(img);
      }
    });

    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();
    showBanner(`Mano ${state.manoCorrente} conclusa!`);
  }

  function showBanner(text) {
    const b = document.getElementById('banner');
    b.textContent = text;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 1400);
  }

  // ═══════════════════════════════════════════════
  //  RESET TOTALE
  // ═══════════════════════════════════════════════
  function resetAll() {
    if (!confirm('Azzerare TUTTO (partita e precedenti)?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  // ═══════════════════════════════════════════════
  //  SALVATAGGIO / CARICAMENTO
  // ═══════════════════════════════════════════════
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const s = JSON.parse(raw);
      state = s;

      state.taken.forEach((mazzo) => {
        mazzo.carte.forEach(index => {
          const el = allCards()[index];
          if (el) el.classList.add('taken');
        });
      });

      setActive(state.activePlayer);
      ricalcolaPunteggi();
    } catch(e) { console.warn('Errore caricamento stato', e); }
  }

  // ═══════════════════════════════════════════════
  //  HINT INIZIALE (appare solo la prima volta)
  // ═══════════════════════════════════════════════
  function showHintOnce() {
    if (localStorage.getItem('scopa_hint_shown')) return;
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => {
      hint.classList.remove('show');
      localStorage.setItem('scopa_hint_shown', '1');
    }, 4000);
  }

  // ═══════════════════════════════════════════════
  //  AVVIO
  // ═══════════════════════════════════════════════
  loadState();
  ricalcolaPunteggi();
  aggiornaUndo();
  showHintOnce();
</script>

</body>
</html>
