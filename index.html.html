<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Segnapunti Scopa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 4px;
    user-select: none;
  }

  /* ── BARRA SUPERIORE (totale + reset) ── */
  .topbar {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
    align-items: stretch;
  }

  .total-box {
    flex: 1 1 0;
    background: #2a2a3e;
    border: 2px solid #fbbf24;
    border-radius: 8px;
    padding: 4px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-width: 0;
  }

  .total-box .label {
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    color: #aaa;
    font-weight: bold;
    letter-spacing: 0.05em;
  }

  .total-box .value {
    font-size: clamp(1.3rem, 6vw, 1.8rem);
    color: #fbbf24;
    font-weight: bold;
    line-height: 1;
  }

  .top-buttons {
    display: flex;
    gap: 3px;
    flex: 0 0 auto;
    flex-direction: column;
  }

  .top-buttons button {
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.68rem;
    color: #fff;
    cursor: pointer;
    padding: 4px 10px;
    white-space: nowrap;
  }

  #btnReset { background: #ef4444; }

  /* ── GRIGLIA CARTE ── */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
    min-height: 0;
  }

  .card {
    border: 1.5px solid #444;
    background: #2a2a3e;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 0;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
    touch-action: none;
  }

  .card.pressing {
    transform: scale(0.92);
    border-color: #fbbf24;
    box-shadow: 0 0 12px rgba(251,191,36,0.9);
    z-index: 2;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
    pointer-events: none;
  }

  /* Carta presa (nel tuo mazzo) */
  .card.taken {
    pointer-events: none;
    background: #15151f;
    border-color: #22c55e;
    box-shadow: inset 0 0 8px rgba(34,197,94,0.4);
  }

  .card.taken img { opacity: 0; }

  /* Carta uscita (scartata) */
  .card.discarded {
    pointer-events: none;
    background: #15151f;
    border-color: #15151f;
  }

  .card.discarded img { opacity: 0.12; filter: grayscale(1); }

  /* ── AZIONI ── */
  .actions {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
    height: 42px;
  }

  .actions button {
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: clamp(0.72rem, 3vw, 0.95rem);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .actions button:active { transform: scale(0.96); filter: brightness(1.2); }

  #btnScopa { background: #f59e0b; flex: 2 1 0; }

  #btnUndo {
    background: #475569;
    flex: 1 1 0;
  }

  #btnUndo:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* ── STATISTICHE COMPATTE ── */
  .stats {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    background: #2a2a3e;
    border-radius: 8px;
    padding: 4px 5px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
    position: relative;
  }

  .stat .icon {
    font-size: clamp(0.85rem, 3.2vw, 1.1rem);
    line-height: 1;
  }

  .stat .value {
    font-size: clamp(0.75rem, 3vw, 1rem);
    font-weight: bold;
    line-height: 1;
    color: #fbbf24;
  }

  .stat.zero .value { color: #555; }

  .stat .icon.gold-seven {
    color: #fbbf24;
    font-weight: 900;
    text-shadow: 0 0 4px rgba(251,191,36,0.7);
    font-size: clamp(0.9rem, 3.6vw, 1.2rem);
  }

  .stat .label {
    font-size: 0.55rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* ── BANNER ── */
  .mano-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: #22c55e;
    color: #fff;
    padding: 14px 22px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 1rem;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .mano-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ── HINT ── */
  .hint {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    text-align: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    line-height: 1.5;
    border: 1px solid #444;
  }

  .hint.show { opacity: 1; }

  .hint b { color: #fbbf24; }
</style>
</head>
<body>

  <!-- BARRA SUPERIORE -->
  <div class="topbar">
    <div class="total-box">
      <span class="label">TOTALE</span>
      <span class="value" id="total">0</span>
    </div>
    <div class="top-buttons">
      <button id="btnReset" onclick="resetAll()">RESET</button>
    </div>
  </div>

  <!-- GRIGLIA -->
  <div class="grid" id="grid"></div>

  <!-- AZIONI -->
  <div class="actions">
    <button id="btnScopa" onclick="segnaScopa()">🧹 SCOPA +1</button>
    <button id="btnUndo" onclick="undo()" disabled>↶ ANNULLA</button>
  </div>

  <!-- STATISTICHE COMPATTE -->
  <div class="stats" id="stats"></div>

  <!-- BANNER -->
  <div class="mano-banner" id="banner"></div>

  <!-- HINT -->
  <div class="hint" id="hint">
    <b>Tocca</b> = carta uscita<br>
    <b>Tieni premuto</b> = carta presa
  </div>

<script>
  // ═══════════════════════════════════════════════
  //  CONFIGURAZIONE
  // ═══════════════════════════════════════════════
  const SUITS = ['DENARI', 'COPPE', 'SPADE', 'BASTONI'];
  const ROWS = 10;
  const COLS = 4;
  const STORAGE_KEY = 'scopa_mono_v1';
  const LONG_PRESS_MS = 450;

  const PRIMIERA_VALUE = {
    1: 16, 2: 12, 3: 13, 4: 14, 5: 15, 6: 18, 7: 21,
    8: 10, 9: 10, 10: 10
  };

  // Barra statistiche (solo il giocatore)
  // Il valore mostrato è un CONTEGGIO (non punti +1)
  const STAT_ITEMS = [
    { key: 'denari',     icon: '🪙', label: 'Ori'      },  // numero di carte di denari prese
    { key: 'primiera',   icon: '🎯', label: 'Primiera' },  // valore primiera (es. 65)
    { key: 'settebello', icon: '7',  label: 'Setteb.', gold: true }, // 0 o 1
    { key: 'carte',      icon: '🃏', label: 'Carte'    }   // numero di carte prese
  ];

  // ═══════════════════════════════════════════════
  //  STATO (mono-giocatore)
  // ═══════════════════════════════════════════════
  let state = {
    prese: [],       // array di indici carte prese con long press
    scope: 0         // numero di scope fatte (contribuisce al totale)
  };

  // Cronologia per Annulla
  let history = [];

  // ═══════════════════════════════════════════════
  //  UTILITÀ
  // ═══════════════════════════════════════════════
  function cardInfo(index) {
    const row = Math.floor(index / COLS) + 1;
    const col = index % COLS;
    return { row, col, suit: SUITS[col] };
  }

  function cardFileName(index) {
    const { row, suit } = cardInfo(index);
    return `${row} ${suit}.jpg`;
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE GRIGLIA
  // ═══════════════════════════════════════════════
  const grid = document.getElementById('grid');
  const fragment = document.createDocumentFragment();

  for (let row = 1; row <= ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const index = (row - 1) * COLS + col;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const img = document.createElement('img');
      img.src = cardFileName(index);
      img.alt = `${row} ${SUITS[col]}`;
      img.onerror = function() {
        this.style.display = 'none';
        card.style.background = '#333';
        card.style.color = '#fff';
        card.style.fontSize = '0.55rem';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.justifyContent = 'center';
        card.textContent = `${row}\n${SUITS[col].slice(0,3)}`;
        card.style.whiteSpace = 'pre-line';
      };
      card.appendChild(img);

      attachCardHandlers(card, index);
      fragment.appendChild(card);
    }
  }
  grid.appendChild(fragment);

  const allCards = () => document.querySelectorAll('.card');

  // ═══════════════════════════════════════════════
  //  CLICK / LONG PRESS
  // ═══════════════════════════════════════════════
  function attachCardHandlers(card, index) {
    let pressTimer = null;
    let longPressFired = false;

    const startPress = () => {
      if (card.classList.contains('taken') || card.classList.contains('discarded')) return;
      longPressFired = false;
      card.classList.add('pressing');
      pressTimer = setTimeout(() => {
        longPressFired = true;
        card.classList.remove('pressing');
        eseguiPresa(index);
        if (navigator.vibrate) navigator.vibrate(30);
      }, LONG_PRESS_MS);
    };

    const cancelPress = () => {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      card.classList.remove('pressing');
    };

    const endPress = () => {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      card.classList.remove('pressing');
      if (!longPressFired) {
        eseguiUscita(index);
        if (navigator.vibrate) navigator.vibrate(10);
      }
      longPressFired = false;
    };

    card.addEventListener('pointerdown', (e) => { e.preventDefault(); startPress(); });
    card.addEventListener('pointerup', endPress);
    card.addEventListener('pointercancel', cancelPress);
    card.addEventListener('pointerleave', cancelPress);
    card.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // ═══════════════════════════════════════════════
  //  AZIONI
  // ═══════════════════════════════════════════════
  function eseguiPresa(index) {
    const el = allCards()[index];
    if (!el || el.classList.contains('taken') || el.classList.contains('discarded')) return;

    state.prese.push(index);
    el.classList.add('taken');

    history.push({ tipo: 'presa', index });
    if (history.length > 100) history.shift();

    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();
  }

  function eseguiUscita(index) {
    const el = allCards()[index];
    if (!el || el.classList.contains('taken') || el.classList.contains('discarded')) return;

    el.classList.add('discarded');

    history.push({ tipo: 'uscita', index });
    if (history.length > 100) history.shift();

    aggiornaUndo();
    saveState();
  }

  function segnaScopa() {
    state.scope += 1;

    history.push({ tipo: 'scopa' });
    if (history.length > 100) history.shift();

    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();

    showBanner(`🧹 Scopa! (+1)`);
    if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
  }

  // ═══════════════════════════════════════════════
  //  UNDO
  // ═══════════════════════════════════════════════
  function aggiornaUndo() {
    document.getElementById('btnUndo').disabled = history.length === 0;
  }

  function undo() {
    if (history.length === 0) return;
    const azione = history.pop();

    if (azione.tipo === 'presa') {
      const pos = state.prese.lastIndexOf(azione.index);
      if (pos !== -1) state.prese.splice(pos, 1);
      const el = allCards()[azione.index];
      if (el) el.classList.remove('taken');
    } else if (azione.tipo === 'uscita') {
      const el = allCards()[azione.index];
      if (el) el.classList.remove('discarded');
    } else if (azione.tipo === 'scopa') {
      state.scope = Math.max(0, state.scope - 1);
    }

    aggiornaUndo();
    ricalcolaPunteggi();
    saveState();
  }

  // ═══════════════════════════════════════════════
  //  STATISTICHE
  // ═══════════════════════════════════════════════
  function buildStats() {
    const container = document.getElementById('stats');
    container.innerHTML = '';
    STAT_ITEMS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'stat zero';
      div.id = 'stat-' + item.key;
      div.title = item.label;

      const icon = document.createElement('div');
      icon.className = 'icon' + (item.gold ? ' gold-seven' : '');
      icon.textContent = item.icon;

      const val = document.createElement('div');
      val.className = 'value';
      val.id = 'val-' + item.key;
      val.textContent = '0';

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = item.label;

      div.appendChild(icon);
      div.appendChild(val);
      div.appendChild(lab);
      container.appendChild(div);
    });
  }
  buildStats();

  // ═══════════════════════════════════════════════
  //  CALCOLO PUNTEGGI
  // ═══════════════════════════════════════════════
  function calcolaStats() {
    let denari = 0;           // numero di ori presi
    let numCarte = state.prese.length;
    let hasSettebello = false;
    const bestPerSuit = [null, null, null, null];

    state.prese.forEach(index => {
      const { row, col, suit } = cardInfo(index);
      if (suit === 'DENARI') {
        denari++;
        if (row === 7) hasSettebello = true;
      }
      const val = PRIMIERA_VALUE[row] || 0;
      if (!bestPerSuit[col] || val > bestPerSuit[col].value) {
        bestPerSuit[col] = { value: val, row, suit };
      }
    });

    const primiera = bestPerSuit.reduce((sum, b) => sum + (b ? b.value : 0), 0);
    const semiCompleti = bestPerSuit.filter(b => b !== null).length;

    return {
      denari,           // conteggio ori (non punto)
      numCarte,         // conteggio carte
      hasSettebello,    // 0 o 1
      primiera,         // valore (es. 65)
      bestPerSuit,
      semiCompleti
    };
  }

  function ricalcolaPunteggi() {
    const s = calcolaStats();

    // Barra statistiche: mostra i CONTEGGI
    const valori = {
      denari:     s.denari,
      primiera:   s.semiCompleti === 4 ? s.primiera : 0, // mostra 0 finché non hai tutti i semi
      settebello: s.hasSettebello ? 1 : 0,
      carte:      s.numCarte
    };

    STAT_ITEMS.forEach(item => {
      const v = valori[item.key];
      const el = document.getElementById('val-' + item.key);
      const wrap = document.getElementById('stat-' + item.key);
      if (el) el.textContent = v;
      if (wrap) wrap.classList.toggle('zero', v === 0);
    });

    // TOTALE: solo dalle carte + scope
    // Punti derivati dalle carte prese:
    // - Settebello: 1 se hai il 7 di denari
    // - Primiera: 1 se hai tutti e 4 i semi (indipendentemente dall'avversario)
    // - Carte: 1 se hai più di 20 carte
    // - Denari: non calcolabile senza sapere l'avversario → NON lo conto nel totale
    const puntiCarte = (s.hasSettebello ? 1 : 0)
                     + (s.numCarte >= 21 ? 1 : 0);
    const puntiPrimiera = s.semiCompleti === 4 ? 1 : 0;
    const totale = puntiCarte + puntiPrimiera + state.scope;

    document.getElementById('total').textContent = totale;
  }

  // ═══════════════════════════════════════════════
  //  RESET
  // ═══════════════════════════════════════════════
  function resetAll() {
    if (!confirm('Azzerare tutto?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  // ═══════════════════════════════════════════════
  //  SALVATAGGIO
  // ═══════════════════════════════════════════════
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const s = JSON.parse(raw);
      state = s;

      // Ripristina carte prese
      state.prese.forEach(index => {
        const el = allCards()[index];
        if (el) el.classList.add('taken');
      });
    } catch(e) { console.warn('Errore caricamento stato', e); }
  }

  // ═══════════════════════════════════════════════
  //  BANNER + HINT
  // ═══════════════════════════════════════════════
  function showBanner(text) {
    const b = document.getElementById('banner');
    b.textContent = text;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 1200);
  }

  function showHintOnce() {
    if (localStorage.getItem('scopa_mono_hint')) return;
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => {
      hint.classList.remove('show');
      localStorage.setItem('scopa_mono_hint', '1');
    }, 5000);
  }

  // ═══════════════════════════════════════════════
  //  AVVIO
  // ═══════════════════════════════════════════════
  loadState();
  ricalcolaPunteggi();
  aggiornaUndo();
  showHintOnce();
</script>

</body>
</html>
