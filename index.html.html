<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Segnapunti Scopa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 4px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── HEADER (avversario) ── */
  .header {
    flex: 0 0 auto;
    background: #2a1a1a;
    border: 1.5px solid #7f1d1d;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .header .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }

  .header .title {
    font-size: 0.7rem;
    color: #f87171;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── GRIGLIA CARTE ── */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
    min-height: 0;
  }

  .card {
    border: 1.5px solid #444;
    background: #2a2a3e;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 0;
    transition: transform 0.1s ease, box-shadow 0.15s ease,
                background 0.15s ease, border-color 0.15s ease,
                opacity 0.25s ease;
    touch-action: none;
    -webkit-user-drag: none;
    will-change: transform;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
    pointer-events: none;
    -webkit-user-drag: none;
    transition: opacity 0.15s ease, filter 0.15s ease;
  }

  /* Carta uscita */
  .card.discarded {
    background: #3a3a4a;
    border-color: #3a3a4a;
  }
  .card.discarded img {
    opacity: 0.55;
    filter: brightness(0.5) grayscale(0.4);
  }

  /* Carta presa da NOI */
  .card.taken-us {
    background: #14532d;
    border-color: #22c55e;
    box-shadow: inset 0 0 10px rgba(34,197,94,0.6);
  }
  .card.taken-us img { opacity: 0; }

  /* Carta presa dall'AVVERSARIO */
  .card.taken-them {
    background: #4c1d1d;
    border-color: #ef4444;
    box-shadow: inset 0 0 10px rgba(239,68,68,0.6);
  }
  .card.taken-them img { opacity: 0; }

  /* ── STATO DRAG ── */
  /* Mentre trascini, la carta è "sollevata" e non ha transizioni sul transform
     (il transform è aggiornato in tempo reale via JS) */
  .card.dragging {
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    z-index: 50;
    cursor: grabbing;
    border-color: #fbbf24;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 16px rgba(251,191,36,0.8);
    /* Il transform è gestito da JS: translate(x, y) */
  }

  .card.dragging-us {
    border-color: #22c55e;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(34,197,94,1);
  }

  .card.dragging-them {
    border-color: #ef4444;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(239,68,68,1);
  }

  /* Animazione di uscita (fly away) */
  .card.flying {
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.6, 1),
                opacity 0.35s ease;
    opacity: 0;
    pointer-events: none;
  }

  /* ── FOOTER (noi) ── */
  .footer {
    flex: 0 0 auto;
    background: #1a2a1a;
    border: 1.5px solid #166534;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .footer .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }
  .footer .title {
    font-size: 0.7rem;
    color: #4ade80;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── STATS ── */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 2.6fr;
    gap: 3px;
    align-items: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
  }
  .stat .icon {
    font-size: clamp(0.8rem, 3vw, 1rem);
    line-height: 1;
  }
  .stat .value {
    font-size: clamp(0.7rem, 2.8vw, 0.95rem);
    font-weight: bold;
    line-height: 1;
    color: #fbbf24;
  }
  .stat.zero .value { color: #555; }
  .stat .label {
    font-size: 0.5rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Primiera con miniature */
  .primiera-box {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    padding: 1px;
  }

  .primiera-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    aspect-ratio: 2 / 3;
    border-radius: 4px;
    border: 1px solid #3a3a4a;
    background: rgba(0,0,0,0.3);
    overflow: hidden;
    position: relative;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  /* Placeholder vuoto: bordo tratteggiato + simbolo del seme sbiadito */
  .primiera-cell.empty {
    border-style: dashed;
    border-color: #333;
  }
  .primiera-cell.empty::after {
    content: attr(data-suit-icon);
    font-size: clamp(0.7rem, 2.8vw, 1rem);
    opacity: 0.25;
    filter: grayscale(1);
  }

  /* Miniatura della carta */
  .primiera-cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
  }

  /* Seme vinto (hai il 7) → bordo verde e glow */
  .primiera-cell.won {
    border-color: #22c55e;
    box-shadow: 0 0 8px rgba(34,197,94,0.9);
  }

  /* ── RESET ── */
  .reset-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
  }
  .reset-bar button {
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.68rem;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ── HINT ── */
  .hint {
    position: fixed;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    background: rgba(0,0,0,0.92);
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    text-align: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    line-height: 1.7;
    border: 1px solid #444;
  }
  .hint.show { opacity: 1; }
  .hint b { color: #fbbf24; }
</style>
</head>
<body>

  <div class="header">
    <div class="title-row">
      <span class="title">▼ LORO</span>
    </div>
    <div class="stats" id="stats-them"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <div class="stats" id="stats-us"></div>
    <div class="title-row">
      <span class="title">▲ NOI</span>
    </div>
  </div>

  <div class="reset-bar">
    <button onclick="resetAll()">RESET</button>
  </div>

  <div class="hint" id="hint">
    <b>Tap</b> = carta uscita<br>
    <b>Trascina giù ↓</b> = presa nostra<br>
    <b>Trascina su ↑</b> = presa loro
  </div>

<script>
  // ═══════════════════════════════════════════════
  //  CONFIGURAZIONE
  // ═══════════════════════════════════════════════
  const SUITS = ['DENARI', 'COPPE', 'SPADE', 'BASTONI'];
  const SUIT_ICONS = { DENARI: '🪙', COPPE: '🏆', SPADE: '⚔️', BASTONI: '🪵' };
  const SUITS_ORDER = ['SPADE', 'COPPE', 'BASTONI', 'DENARI'];
  const ROWS = 10;
  const COLS = 4;
  const STORAGE_KEY = 'scopa_mono_v7';
  const DRAG_THRESHOLD = 12;
  const MAX_ROW = 7;
  const FLY_DURATION = 350; // ms

  const PRIMIERA_VALUE = {
    1: 16, 2: 12, 3: 13, 4: 14, 5: 15, 6: 18, 7: 21,
    8: 10, 9: 10, 10: 10
  };

  let cardStates = new Array(ROWS * COLS).fill(0);
  // 0 = nuova, 1 = uscita, 2 = presa da NOI, 3 = presa da LORO

  // ═══════════════════════════════════════════════
  //  UTILITÀ
  // ═══════════════════════════════════════════════
  function cardInfo(index) {
    const row = Math.floor(index / COLS) + 1;
    const col = index % COLS;
    return { row, col, suit: SUITS[col] };
  }
  function cardFileName(index) {
    const { row, suit } = cardInfo(index);
    return `${row} ${suit}.jpg`;
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE GRIGLIA
  // ═══════════════════════════════════════════════
  const grid = document.getElementById('grid');
  const fragment = document.createDocumentFragment();

  for (let row = 1; row <= ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const index = (row - 1) * COLS + col;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      const img = document.createElement('img');
      img.src = cardFileName(index);
      img.alt = `${row} ${SUITS[col]}`;
      img.draggable = false;
      img.onerror = function() {
        this.style.display = 'none';
        card.style.background = '#333';
        card.style.color = '#fff';
        card.style.fontSize = '0.55rem';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.justifyContent = 'center';
        card.textContent = `${row}\n${SUITS[col].slice(0,3)}`;
        card.style.whiteSpace = 'pre-line';
      };
      card.appendChild(img);

      attachHandlers(card, index);
      fragment.appendChild(card);
    }
  }
  grid.appendChild(fragment);

  const allCards = () => document.querySelectorAll('.card');

  // ═══════════════════════════════════════════════
  //  GESTIONE DRAG CON ANIMAZIONE
  // ═══════════════════════════════════════════════
  let activeDrag = null;
  // activeDrag = { index, card, startX, startY, mode }

  function attachHandlers(card, index) {
    card.addEventListener('pointerdown', (e) => {
      if (cardStates[index] !== 0) return;
      e.preventDefault();
      startDrag(index, card, e.clientX, e.clientY);
    });

    card.addEventListener('touchstart', (e) => {
      if (window.PointerEvent) return;
      if (cardStates[index] !== 0) return;
      const t = e.touches[0];
      startDrag(index, card, t.clientX, t.clientY);
      e.preventDefault();
    }, { passive: false });

    card.addEventListener('mousedown', (e) => {
      if (window.PointerEvent) return;
      if (cardStates[index] !== 0) return;
      e.preventDefault();
      startDrag(index, card, e.clientX, e.clientY);
    });

    card.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function startDrag(index, card, x, y) {
    activeDrag = {
      index, card,
      startX: x, startY: y,
      mode: null,
      moved: false
    };
    card.classList.add('dragging');
  }

  function updateDrag(x, y) {
    if (!activeDrag) return;
    const dx = x - activeDrag.startX;
    const dy = y - activeDrag.startY;
    const dist = Math.hypot(dx, dy);

    // Muovi fisicamente la carta
    activeDrag.card.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;

    if (dist > DRAG_THRESHOLD) {
      activeDrag.moved = true;
      const mode = dy > 0 ? 'us' : 'them';
      if (mode !== activeDrag.mode) {
        activeDrag.card.classList.remove('dragging-us', 'dragging-them');
        activeDrag.mode = mode;
        activeDrag.card.classList.add(mode === 'us' ? 'dragging-us' : 'dragging-them');
      }
    } else if (activeDrag.mode) {
      activeDrag.card.classList.remove('dragging-us', 'dragging-them');
      activeDrag.mode = null;
    }
  }

  function endDrag(x, y) {
    if (!activeDrag) return;
    const { index, card, startX, startY, moved } = activeDrag;

    const dx = x - startX;
    const dy = y - startY;
    const dist = Math.hypot(dx, dy);

    // Rimuovi classi di drag
    card.classList.remove('dragging', 'dragging-us', 'dragging-them');

    if (dist <= DRAG_THRESHOLD) {
      // Tap → uscita
      card.style.transform = ''; // torna a posto
      activeDrag = null;
      applicaStato(index, 1);
      ricalcolaPunteggi();
      saveState();
      return;
    }

    // C'è stato un drag: anima la carta che "vola via"
    // Direzione: giù (us) o su (them)
    const targetY = dy > 0 ? dy + 200 : dy - 200;
    card.style.transform = `translate(${dx}px, ${targetY}px) scale(0.6)`;

    // Applica lo stato SUBITO (l'immagine dentro sparisce, ma la carta vola via comunque)
    const nuovoStato = dy > 0 ? 2 : 3;
    applicaStato(index, nuovoStato);

    // Dopo l'animazione, resetta il transform della carta
    setTimeout(() => {
      card.style.transform = '';
    }, FLY_DURATION);

    activeDrag = null;
    ricalcolaPunteggi();
    saveState();
  }

  function cancelDrag() {
    if (activeDrag) {
      activeDrag.card.classList.remove('dragging', 'dragging-us', 'dragging-them');
      activeDrag.card.style.transform = '';
      activeDrag = null;
    }
  }

  // Listener globali
  document.addEventListener('pointermove', (e) => {
    if (!activeDrag) return;
    updateDrag(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', (e) => {
    if (!activeDrag) return;
    endDrag(e.clientX, e.clientY);
  });
  document.addEventListener('pointercancel', cancelDrag);

  // Fallback touch
  document.addEventListener('touchmove', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    const t = e.touches[0];
    updateDrag(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    const t = e.changedTouches[0];
    endDrag(t.clientX, t.clientY);
  });
  document.addEventListener('touchcancel', () => {
    if (window.PointerEvent) return;
    cancelDrag();
  });

  // Fallback mouse
  document.addEventListener('mousemove', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    updateDrag(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', (e) => {
    if (window.PointerEvent || !activeDrag) return;
    endDrag(e.clientX, e.clientY);
  });

  // ═══════════════════════════════════════════════
  //  APPLICAZIONE STATO
  // ═══════════════════════════════════════════════
  function applicaStato(index, nuovoStato) {
    cardStates[index] = nuovoStato;
    const el = allCards()[index];
    if (!el) return;

    el.classList.remove('discarded', 'taken-us', 'taken-them');
    if (nuovoStato === 1) el.classList.add('discarded');
    else if (nuovoStato === 2) el.classList.add('taken-us');
    else if (nuovoStato === 3) el.classList.add('taken-them');
  }

  // ═══════════════════════════════════════════════
  //  COSTRUZIONE STATS
  // ═══════════════════════════════════════════════
  function buildStatsFor(containerId, chi) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    const items = [
      { key: 'denari', icon: '🪙', label: 'Ori'   },
      { key: 'carte',  icon: '🃏', label: 'Carte' }
    ];

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'stat zero';
      div.dataset.player = chi;
      div.dataset.key = item.key;

      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = item.icon;

      const val = document.createElement('div');
      val.className = 'value';
      val.textContent = '0';

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = item.label;

      div.appendChild(icon);
      div.appendChild(val);
      div.appendChild(lab);
      container.appendChild(div);
    });

    // Primiera con 4 miniature di carte
    const priBox = document.createElement('div');
    priBox.className = 'primiera-box';
    priBox.dataset.player = chi;
    priBox.dataset.key = 'primiera';

    SUITS_ORDER.forEach(suit => {
      const cell = document.createElement('div');
      cell.className = 'primiera-cell empty';
      cell.dataset.suit = suit;
      cell.dataset.player = chi;
      cell.dataset.suitIcon = SUIT_ICONS[suit];
      priBox.appendChild(cell);
    });

    container.appendChild(priBox);
  }

  buildStatsFor('stats-them', 3);
  buildStatsFor('stats-us', 2);

  // ═══════════════════════════════════════════════
  //  CALCOLO
  // ═══════════════════════════════════════════════
  function calcolaStats(chi) {
    let denari = 0;
    let numCarte = 0;
    const bestPerSuit = { DENARI: null, COPPE: null, SPADE: null, BASTONI: null };

    cardStates.forEach((stato, index) => {
      if (stato !== chi) return;
      const { row, col, suit } = cardInfo(index);
      numCarte++;
      if (suit === 'DENARI') denari++;

      const val = PRIMIERA_VALUE[row] || 0;
      if (!bestPerSuit[suit] || val > bestPerSuit[suit].value) {
        bestPerSuit[suit] = { value: val, row, suit, index };
      }
    });

    return { denari, numCarte, bestPerSuit };
  }

  function ricalcolaPunteggi() {
    [2, 3].forEach(chi => {
      const s = calcolaStats(chi);
      const containerId = chi === 2 ? 'stats-us' : 'stats-them';
      const container = document.getElementById(containerId);

      // Ori
      const ori = container.querySelector(`.stat[data-key="denari"]`);
      if (ori) {
        ori.querySelector('.value').textContent = s.denari;
        ori.classList.toggle('zero', s.denari === 0);
      }

      // Carte
      const carte = container.querySelector(`.stat[data-key="carte"]`);
      if (carte) {
        carte.querySelector('.value').textContent = s.numCarte;
        carte.classList.toggle('zero', s.numCarte === 0);
      }

      // Primiera: miniatura della carta più alta per seme
      SUITS_ORDER.forEach(suit => {
        const cell = container.querySelector(`.primiera-cell[data-suit="${suit}"]`);
        if (!cell) return;
        const b = s.bestPerSuit[suit];

        // Svuota la cella
        cell.innerHTML = '';
        cell.classList.remove('won');

        if (b) {
          // C'è una carta: mostra la miniatura
          cell.classList.remove('empty');
          const img = document.createElement('img');
          img.src = `${b.row} ${suit}.jpg`;
          img.alt = `${b.row} di ${suit}`;
          img.draggable = false;
          img.onerror = function() {
            // Fallback: se manca l'immagine, mostra numero + emoji
            this.remove();
            cell.textContent = `${b.row}${SUIT_ICONS[suit]}`;
            cell.style.color = '#fbbf24';
            cell.style.fontWeight = 'bold';
            cell.style.fontSize = 'clamp(0.6rem, 2.4vw, 0.85rem)';
            cell.style.display = 'flex';
            cell.style.alignItems = 'center';
            cell.style.justifyContent = 'center';
          };
          cell.appendChild(img);

          // Se è un 7, evidenzia in verde
          if (b.row === MAX_ROW) cell.classList.add('won');
        } else {
          // Nessuna carta: placeholder
          cell.classList.add('empty');
        }
      });
    });
  }

  // ═══════════════════════════════════════════════
  //  RESET / SALVATAGGIO
  // ═══════════════════════════════════════════════
  function resetAll() {
    if (!confirm('Azzerare tutto?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStates));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === cardStates.length) {
        cardStates = arr;
        cardStates.forEach((stato, index) => applicaStato(index, stato));
      }
    } catch(e) { console.warn('Errore caricamento stato', e); }
  }

  // ═══════════════════════════════════════════════
  //  HINT
  // ═══════════════════════════════════════════════
  function showHintOnce() {
    if (localStorage.getItem('scopa_mono_hint_v7')) return;
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => {
      hint.classList.remove('show');
      localStorage.setItem('scopa_mono_hint_v7', '1');
    }, 6000);
  }

  // ═══════════════════════════════════════════════
  //  AVVIO
  // ═══════════════════════════════════════════════
  loadState();
  ricalcolaPunteggi();
  showHintOnce();
</script>

</body>
</html>
